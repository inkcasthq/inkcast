# Dev only: fake DEV and Medium APIs next to Inkcast in kind (deploy/dev). Inkcast's dev config points at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkcast-fakes
  namespace: inkcast
  labels: {app.kubernetes.io/name: inkcast-fakes}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: inkcast-fakes}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inkcast-fakes}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fakes
          image: inkcast-fakes:dev
          imagePullPolicy: Never
          env:
            - {name: FAKES_PUBLIC_URL, value: "http://inkcast-fakes:8999"}
          ports:
            - {name: http, containerPort: 8999}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: inkcast-fakes
  namespace: inkcast
spec:
  selector: {app.kubernetes.io/name: inkcast-fakes}
  ports:
    - {name: http, port: 8999, targetPort: http}
---
# The base policy allows egress only to DNS and 443; let Inkcast reach the fakes (enforced where the CNI does).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inkcast-to-fakes
  namespace: inkcast
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: server}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: inkcast-fakes}
      ports:
        - {port: 8999, protocol: TCP}

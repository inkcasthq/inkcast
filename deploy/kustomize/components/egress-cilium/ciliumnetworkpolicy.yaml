# Cilium FQDN egress allow-list. Add a matchName per platform plug-in you enable.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inkcast-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - matchName: sso.example.com
        - matchName: api.medium.com
        - matchName: dev.to
      toPorts:
        - ports: [{port: "443", protocol: TCP}]

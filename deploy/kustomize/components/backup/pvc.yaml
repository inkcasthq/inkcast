apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inkcast-backups
  labels: {app.kubernetes.io/name: inkcast, app.kubernetes.io/component: backup}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi        # 14 daily copies of a small SQLite file; grow it with the data

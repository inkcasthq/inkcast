# The backup touches only files: no network in or out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inkcast-backup
  labels: {app.kubernetes.io/name: inkcast, app.kubernetes.io/component: backup}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: backup}
  policyTypes: [Ingress, Egress]

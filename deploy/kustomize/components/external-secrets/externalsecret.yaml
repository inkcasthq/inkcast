# External Secrets Operator: syncs `inkcast-secrets` from Vault/OpenBao or a cloud secret manager.
# Check the API version against your installed ESO release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inkcast-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets          # your store
  target:
    name: inkcast-secrets
    creationPolicy: Owner
    # The root Secret's label, as `inkcast env-secrets` sets it: what the cluster backup selects (#436, ADR-0020).
    # A template with metadata alone keeps the keys fetched below under either policy on ESO 0.17 and later
    # (external-secrets.io/v1: externalsecret_controller_template.go:97-99 applies the template's data only when it
    # has some); `Merge` is stated so the intent is explicit and holds on a release that reads it strictly.
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: {inkcast.io/root-secret: "true"}
  data:
    - secretKey: secret-key
      remoteRef: {key: inkcast/server, property: secret-key}
    - secretKey: oidc-client-secret
      remoteRef: {key: inkcast/server, property: oidc-client-secret}

# External Secrets Operator: syncs `inkcast-secrets` from Vault/OpenBao or a cloud secret manager.
# Check the API version against your installed ESO release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inkcast-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets          # your store
  target:
    name: inkcast-secrets
    creationPolicy: Owner
    # The root Secret's label, as `inkcast env-secrets` sets it: what the cluster backup selects (#436, ADR-0020).
    # `Merge` keeps the keys fetched below beside the template's label; ESO's default, `Replace`, would drop them
    # (external-secrets.io, guides/templating: "the templating mechanism will not use any information available
    # from the original data and dataFrom queries").
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels: {inkcast.io/root-secret: "true"}
  data:
    - secretKey: secret-key
      remoteRef: {key: inkcast/server, property: secret-key}
    - secretKey: oidc-client-secret
      remoteRef: {key: inkcast/server, property: oidc-client-secret}

# One Keycloak server pod stays up through a voluntary disruption (a node drain, a cluster upgrade): with two
# instances, the eviction API may take one at a time and never both. The selector is the one the operator's
# StatefulSet uses for its pods (Utils.allInstanceLabels at Keycloak 26.6.4: app=keycloak,
# app.kubernetes.io/managed-by=keycloak-operator, app.kubernetes.io/instance=<the CR's name>, which
# KeycloakDeploymentDependentResource.createBaseDeployment sets as spec.selector.matchLabels). A realm import Job's
# pods carry app=keycloak-realm-import instead and are not budgeted: an import may be evicted and runs again.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: identity}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
      app.kubernetes.io/instance: keycloak

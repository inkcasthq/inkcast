        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-latency
    - alert: InkcastSloBurnApiLatency
      expr: inkcast_slo:api_latency:error_ratio_3d > (1.0 * 0.01) and inkcast_slo:api_latency:error_ratio_6h > (1.0 * 0.01)

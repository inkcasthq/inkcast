# GENERATED by scripts/gen-alerts.py from libs/alerting.py (the alert catalogue and SLOs). Do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inkcast
  labels:
    app.kubernetes.io/name: inkcast
    app.kubernetes.io/part-of: inkcast
    role: alert-rules
spec:
  groups:
  - name: inkcast.alerts
    rules:
    - alert: InkcastTargetDown
      expr: up{job=~".*inkcast.*"} == 0
      for: 5m
      labels:
        severity: critical
        team: inkcast
        service: platform
      annotations:
        summary: An Inkcast pod is not answering /metrics
        description: '{{ $labels.instance }} ({{ $labels.pod }}) has not been scraped successfully for 5 minutes.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcasttargetdown
    - alert: InkcastSchedulerStalled
      expr: sum(rate(inkcast_scheduler_ticks_total[10m])) == 0 or absent(inkcast_scheduler_ticks_total)
      for: 10m
      labels:
        severity: critical
        team: inkcast
        service: scheduler-worker
      annotations:
        summary: The scheduler loop has stopped ticking
        description: 'No scheduler tick for 10 minutes: scheduled posts will not go out. Check the scheduler-worker pod and
          its readiness (it reports ''scheduler: no tick recently'').'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastschedulerstalled
    - alert: InkcastPostsOverdue
      expr: max(inkcast_posts_overdue) > 0
      for: 5m
      labels:
        severity: critical
        team: inkcast
        service: scheduler-worker
      annotations:
        summary: Scheduled posts are past due
        description: '{{ $value }} post(s) are more than INKCAST_OVERDUE_GRACE past their time: the scheduler is behind, stuck
          or stopped.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastpostsoverdue
    - alert: InkcastQueueHeadLagHigh
      expr: max(inkcast_posts_oldest_due_age_seconds) > 300
      for: 10m
      labels:
        severity: warning
        team: inkcast
        service: scheduler-worker
      annotations:
        summary: The oldest due post has waited more than 5 minutes
        description: 'Head-of-line lag is {{ $value | humanizeDuration }}: ticks are slow (a platform is slow, or the batch
          is too small for the load). Not yet overdue.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastqueueheadlaghigh
    - alert: InkcastUnconfirmedPublishes
      expr: sum(increase(inkcast_publish_total{status="unconfirmed"}[1h])) > 0
      for: 0m
      labels:
        severity: warning
        team: inkcast
        service: publishing
      annotations:
        summary: Posts are unconfirmed and wait for a person
        description: '{{ $value }} publish(es) in the last hour ended unconfirmed: the platform may or may not have the post.
          Someone must check the platform before anyone publishes again.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastunconfirmedpublishes
    - alert: InkcastPublishFailureRateHigh
      expr: sum by (platform) (rate(inkcast_publish_total{status=~"failed|update_failed"}[30m])) / clamp_min(sum by (platform)
        (rate(inkcast_publish_total[30m])), 1e-9) > 0.2 and sum by (platform) (increase(inkcast_publish_total[30m])) >= 5
      for: 10m
      labels:
        severity: warning
        team: inkcast
        service: publishing
      annotations:
        summary: More than 20% of publishes to {{ $labels.platform }} fail
        description: '{{ $value | humanizePercentage }} of attempts to {{ $labels.platform }} failed over 30 minutes (at least
          5 attempts). A platform outage, revoked credentials or a plug-in bug.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastpublishfailureratehigh
    - alert: InkcastHttp5xxRateHigh
      expr: sum by (route) (rate(inkcast_http_request_duration_seconds_count{code="5xx",route=~"/api/.*|/mcp"}[10m])) / clamp_min(sum
        by (route) (rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[10m])), 1e-9) > 0.05
      for: 10m
      labels:
        severity: warning
        team: inkcast
        service: publishing-api
      annotations:
        summary: 5xx rate above 5% on {{ $labels.route }}
        description: '{{ $value | humanizePercentage }} of requests to {{ $labels.route }} returned 5xx over 10 minutes.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcasthttp5xxratehigh
    - alert: InkcastGatewayUpstreamUnreachable
      expr: sum by (upstream) (increase(inkcast_gateway_requests_total{code="error"}[5m])) > 0
      for: 5m
      labels:
        severity: critical
        team: inkcast
        service: gateway
      annotations:
        summary: The built-in Gateway cannot reach {{ $labels.upstream }}
        description: Requests to {{ $labels.upstream }} fail at the Gateway (502 upstream_unreachable). The service is down,
          its Service has no endpoints, or the NetworkPolicy blocks the Gateway.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastgatewayupstreamunreachable
    - alert: InkcastOutboxConsumerLag
      expr: max by (consumer) (inkcast_outbox_oldest_age_seconds) > 600
      for: 10m
      labels:
        severity: warning
        team: inkcast
        service: insights-service
      annotations:
        summary: Outbox consumer {{ $labels.consumer }} is 10 minutes behind
        description: 'Domain events wait {{ $value | humanizeDuration }} for consumer {{ $labels.consumer }}: KPIs are stale.
          A sink keeps failing (see outbox.consumer.failed in the logs) or the InsightsService pod is down.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastoutboxconsumerlag
    - alert: InkcastCacheBackendErrors
      expr: sum(rate(inkcast_cache_errors_total[5m])) > 0
      for: 10m
      labels:
        severity: warning
        team: inkcast
        service: platform
      annotations:
        summary: Redis/Valkey is failing; rate limits are per replica
        description: Cache backend errors for 10 minutes. Services keep working on in-process fallbacks, so limits and locks
          are no longer shared across replicas.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastcachebackenderrors
    - alert: InkcastRateLimitSurge
      expr: sum(rate(inkcast_ratelimit_total{decision="limited"}[5m])) > 1
      for: 15m
      labels:
        severity: info
        team: inkcast
        service: identity-service
      annotations:
        summary: Unauthenticated writes are being rate-limited at more than 1/s
        description: 'Sustained 429s on registration, sign-in, tokens or connect pages: a client in a loop, or abuse. Consider
          an edge rule.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastratelimitsurge
    - alert: InkcastPodRestarting
      expr: increase(kube_pod_container_status_restarts_total{container="inkcast"}[1h]) > 3
      for: 5m
      labels:
        severity: warning
        team: inkcast
        service: platform
      annotations:
        summary: '{{ $labels.pod }} restarted more than 3 times in an hour'
        description: A crash loop or a failing probe. Exit code 78 means a configuration problem (the config.unsafe log line
          lists it).
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastpodrestarting
    - alert: InkcastDataVolumeNearlyFull
      expr: kubelet_volume_stats_available_bytes{persistentvolumeclaim="inkcast-data"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="inkcast-data"}
        < 0.1
      for: 15m
      labels:
        severity: warning
        team: inkcast
        service: platform
      annotations:
        summary: The SQLite volume has less than 10% free
        description: '{{ $value | humanizePercentage }} of inkcast-data is free. Writes will start failing; grow the PVC or
          purge.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastdatavolumenearlyfull
    - alert: InkcastBackupMissing
      expr: time() - kube_cronjob_status_last_successful_time{cronjob="inkcast-backup"} > 26 * 3600
      for: 15m
      labels:
        severity: critical
        team: inkcast
        service: platform
      annotations:
        summary: No successful database backup for more than 26 hours
        description: The inkcast-backup CronJob has not succeeded since {{ $value | humanizeDuration }} ago. The SQLite file
          is the only copy of tokens, credentials, posts and the ledger until a backup succeeds.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastbackupmissing
    - alert: InkcastIdentitySyncFailing
      expr: sum(increase(inkcast_identity_sync_total{result="error"}[15m])) > 0 and sum(increase(inkcast_identity_sync_total{result="ok"}[15m]))
        == 0
      for: 5m
      labels:
        severity: warning
        team: inkcast
        service: identity
      annotations:
        summary: The Keycloak user sync has failed for 15 minutes
        description: Every Keycloak user sync pass for 15 minutes failed, so people disabled or deleted in Keycloak keep their
          Inkcast tokens until it recovers. Sign-in itself is unaffected.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastidentitysyncfailing
    - alert: InkcastIdentitySyncPersonFailing
      expr: sum by (stage) (increase(inkcast_identity_sync_errors_total[30m])) > 0
      for: 1h
      labels:
        severity: warning
        team: inkcast
        service: identity
      annotations:
        summary: The Keycloak user sync keeps failing at stage {{ $labels.stage }}
        description: 'For an hour, every 30 minutes has had a Keycloak user sync failure at stage {{ $labels.stage }}: Keycloak
          answers an error about one person (users/{id} or their events), so they are neither cut off nor erased while everyone
          else is. The identity.sync.person.failed log lines name the Inkcast user id, the read and the HTTP status. If InkcastIdentitySyncFailing
          fires too, follow it first.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastidentitysyncpersonfailing
    - alert: InkcastIdentitySyncBreakerOpen
      expr: max(inkcast_identity_sync_breaker_open) > 0
      for: 0m
      labels:
        severity: critical
        team: inkcast
        service: identity
      annotations:
        summary: The Keycloak user sync holds a mass deletion for an operator
        description: 'A reconcile found at least INKCAST_KEYCLOAK_BREAKER_MIN people, and more than INKCAST_KEYCLOAK_BREAKER_PERCENT
          of those it read, gone from Keycloak at once (404 User not found). Nobody is cut off or erased and no grace period
          starts until an operator decides: a Keycloak restored from an older backup, the issuer pointing at the wrong Keycloak,
          or a user-storage provider disabled for maintenance all look like this. Check Keycloak, then `inkcast identity confirm-deletions
          --pass <id>` (the people really are gone) or `dismiss-deletions` (Keycloak was wrong, and is fixed); the identity.sync.breaker.tripped
          log line and `inkcast identity trips` name the pass.'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastidentitysyncbreakeropen
    - alert: InkcastAuthzErrors
      expr: sum(rate(inkcast_authz_checks_total{result="error"}[5m])) > 0
      for: 5m
      labels:
        severity: critical
        team: inkcast
        service: platform
      annotations:
        summary: The authorization engine is failing; requests are refused (503)
        description: 'Permission checks have been failing for 5 minutes ({{ $value | humanize }}/s). Every failed check is
          a 503 for the caller: nothing is granted without an answer. OpenFGA is down or unreachable, the pinned model id
          is wrong, or the preshared key was rotated on one side only (authz.error in the logs says which).'
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#inkcastauthzerrors
  - name: inkcast.slo.api-availability
    interval: 1m
    rules:
    - record: inkcast_slo:api_availability:error_ratio_5m
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[5m])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[5m])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_30m
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[30m])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[30m])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_1h
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[1h])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[1h])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_2h
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[2h])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[2h])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_6h
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[6h])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[6h])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_1d
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[1d])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[1d])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:error_ratio_3d
      expr: 1 - (sum(rate(inkcast_http_request_duration_seconds_count{code!="5xx",route=~"/api/.*|/mcp"}[3d])) / clamp_min(sum(rate(inkcast_http_request_duration_seconds_count{route=~"/api/.*|/mcp"}[3d])),
        1e-9))
      labels:
        slo: api-availability
        service: publishing-api
    - record: inkcast_slo:api_availability:objective
      expr: '0.999'
      labels:
        slo: api-availability
        service: publishing-api
    - alert: InkcastSloBurnApiAvailability
      expr: inkcast_slo:api_availability:error_ratio_1h > (14.4 * 0.001) and inkcast_slo:api_availability:error_ratio_5m >
        (14.4 * 0.001)
      for: 2m
      labels:
        severity: critical
        team: inkcast
        service: publishing-api
        slo: api-availability
        burn_rate: '14.4'
        long_window: 1h
        short_window: 5m
      annotations:
        summary: SLO api-availability burns its error budget 14.4x over 1h
        description: Requests to the API and MCP endpoints that do not fail with a 5xx. Objective 99.900% over 30 days; the
          error ratio over 1h and 5m both exceed 14.4x the budget (0.100%). At this rate the monthly budget is gone in 50
          hours.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-availability
    - alert: InkcastSloBurnApiAvailability
      expr: inkcast_slo:api_availability:error_ratio_6h > (6.0 * 0.001) and inkcast_slo:api_availability:error_ratio_30m >
        (6.0 * 0.001)
      for: 2m
      labels:
        severity: critical
        team: inkcast
        service: publishing-api
        slo: api-availability
        burn_rate: '6.0'
        long_window: 6h
        short_window: 30m
      annotations:
        summary: SLO api-availability burns its error budget 6.0x over 6h
        description: Requests to the API and MCP endpoints that do not fail with a 5xx. Objective 99.900% over 30 days; the
          error ratio over 6h and 30m both exceed 6.0x the budget (0.100%). At this rate the monthly budget is gone in 120
          hours.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-availability
    - alert: InkcastSloBurnApiAvailability
      expr: inkcast_slo:api_availability:error_ratio_1d > (3.0 * 0.001) and inkcast_slo:api_availability:error_ratio_2h >
        (3.0 * 0.001)
      for: 2m
      labels:
        severity: warning
        team: inkcast
        service: publishing-api
        slo: api-availability
        burn_rate: '3.0'
        long_window: 1d
        short_window: 2h
      annotations:
        summary: SLO api-availability burns its error budget 3.0x over 1d
        description: Requests to the API and MCP endpoints that do not fail with a 5xx. Objective 99.900% over 30 days; the
          error ratio over 1d and 2h both exceed 3.0x the budget (0.100%). At this rate the monthly budget is gone in 240
          hours.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-availability
    - alert: InkcastSloBurnApiAvailability
      expr: inkcast_slo:api_availability:error_ratio_3d > (1.0 * 0.001) and inkcast_slo:api_availability:error_ratio_6h >
        (1.0 * 0.001)
      for: 2m
      labels:
        severity: warning
        team: inkcast
        service: publishing-api
        slo: api-availability
        burn_rate: '1.0'
        long_window: 3d
        short_window: 6h
      annotations:
        summary: SLO api-availability burns its error budget 1.0x over 3d
        description: Requests to the API and MCP endpoints that do not fail with a 5xx. Objective 99.900% over 30 days; the
          error ratio over 3d and 6h both exceed 1.0x the budget (0.100%). At this rate the monthly budget is gone in 720
          hours.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-availability
  - name: inkcast.slo.api-latency

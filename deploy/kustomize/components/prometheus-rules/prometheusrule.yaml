        description: API and MCP requests answered within one second. Objective 99.000% over 30 days; the error ratio over
          1h and 5m both exceed 14.4x the budget (1.000%). At this rate the monthly budget is gone in 50 hours.
        runbook_url: https://github.com/inkcasthq/inkcast/blob/main/docs/runbooks/alerts.md#slo-api-latency
    - alert: InkcastSloBurnApiLatency
      expr: inkcast_slo:api_latency:error_ratio_6h > (6.0 * 0.01) and inkcast_slo:api_latency:error_ratio_30m > (6.0 * 0.01)

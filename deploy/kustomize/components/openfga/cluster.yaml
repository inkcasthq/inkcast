# OpenFGA's own PostgreSQL, run by CloudNativePG (ADR-0014). The operator creates the database and its owner, and
# the Secret `openfga-db-app` with the connection URI (`uri`), which the init container migrate and the server read:
# no credential is written here. One instance suits CI, OpenShift Local and a small self-host; production patches
# `instances: 3`.
#
# The operator makes the pods fit Pod Security "restricted" and the restricted-v2 SCC itself (read-only root
# filesystem, every capability dropped, RuntimeDefault seccomp; a fixed uid on Kubernetes, the namespace's on
# OpenShift). The image is the operator's default for this release, pinned by digest so it is mirrored like the rest.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-db
  labels: {app.kubernetes.io/name: openfga-db, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: authz-db}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

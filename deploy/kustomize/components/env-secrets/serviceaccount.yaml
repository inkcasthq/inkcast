# The identity `inkcast env-secrets` writes the environment's Secrets as: its own, so no other pod holds its rights
# (Inkcast's pods run as `inkcast`, which reads nothing from the API). No token is mounted from it by default: OpenFGA's
# pod mounts one, projected, into the init container alone (openfga.yaml). It pulls the private image with ghcr-pull,
# as the environments' ServiceAccount `inkcast` does (environments/staging, the pull Secret's patches).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inkcast-env-secrets
  labels: {app.kubernetes.io/name: inkcast-env-secrets, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: env-secrets}
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull

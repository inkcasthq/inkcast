# The cluster makes every generated Secret of a lab environment (E3.F3.9.S7, issue #323): no secret script, no copied
# value, no command typed by a person. Included by environments/staging and environments/production only; a self-host
# using the overlays brings its own Secrets (README, Hosted §2).
#
# What it adds: the init container `env-secrets` in OpenFGA's pod (openfga.yaml), which runs `inkcast env-secrets`
# (src/inkcast/env_secrets.py) with the release's image, and its ServiceAccount and Role. At every start of that pod
# it creates, when absent, inkcast-db/inkcast-pg-openfga-<side>, <namespace>/openfga-db-app,
# keycloak/inkcast-<side>-realm and <namespace>/inkcast-secrets; copies a value present on one side of a pair to the
# other; refuses, naming the pair, two sides that disagree; and never replaces a value. The roles in inkcast-db and
# keycloak are in deploy/kustomize/shared/inkcast-db (rbac.yaml) and deploy/kustomize/shared/keycloak-access: a
# Role belongs to its namespace, which this environment's `namespace:` would rewrite.
#
# Why an init container and not a Job: a Job's template is immutable, so a Job that runs the release's image is
# refused by the next release's apply while it still exists ("field is immutable"), and a Job that failed and was
# deleted by its TTL is not run again until someone applies again. A Deployment's template is not immutable, and a
# failing init container is retried by the kubelet, with its backoff, until it succeeds: no window, no stuck state,
# no manual step. It runs before OpenFGA's own container reads openfga-db-app and inkcast-secrets (the kubelet
# resolves a container's secretKeyRef when it starts that container), so OpenFGA always starts on the values this run
# wrote: a pair generated anew is the pair OpenFGA connects with, without a restart. A pod whose run fails never
# starts OpenFGA: during a rollout the previous pod keeps serving.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - serviceaccount.yaml
  - rbac.yaml
patches:
  - path: openfga.yaml

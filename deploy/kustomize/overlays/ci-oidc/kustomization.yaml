# Used only by CI (kind): Inkcast signing people in through a real Keycloak (deploy/keycloak, E9.F9.1). The secret
# `inkcast-secrets` is made by scripts/dev/keycloak-e2e.sh: a random secret key and the client secret Keycloak got.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast-oidc
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_PUBLIC_URL=http://localhost:8787   # the driver runs in the pod, so this is the browser's view too
      - INKCAST_ENV=ci
      - INKCAST_LOGIN=oidc
      - OIDC_ISSUER=http://keycloak.keycloak.svc:8080/realms/inkcast
      - OIDC_CLIENT_ID=inkcast-identity
      - OIDC_REQUIRED_ROLE=inkcast-user
images:
  - name: ghcr.io/inkcasthq/inkcast
    newName: inkcast
    newTag: ci
patches:
  - target: {kind: Deployment, name: inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # The base allows egress to 443 only; this Keycloak listens on 8080 in its own namespace.
  - target: {kind: NetworkPolicy, name: inkcast}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: keycloak}
          ports:
            - {port: 8080, protocol: TCP}

# Used only by CI (kind): Inkcast signing people in through a real Keycloak (deploy/keycloak, E9.F9.1). The secret
# `inkcast-secrets` is made by scripts/dev/keycloak-e2e.sh: a random secret key and the client secrets Keycloak got
# (inkcast-identity for sign-in, inkcast-sync for the user sync).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast-oidc
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_PUBLIC_URL=http://localhost:8787   # the driver runs in the pod, so this is the browser's view too
      - INKCAST_ENV=ci
      - INKCAST_LOGIN=oidc
      - OIDC_ISSUER=http://keycloak.keycloak.svc:8080/realms/inkcast
      - OIDC_CLIENT_ID=inkcast-identity
      - OIDC_REQUIRED_ROLE=inkcast-user
      # E9.F9.5.S2: the user sync, as the realm's inkcast-sync service account, every 5 s (production: 30 s)
      - INKCAST_KEYCLOAK_SYNC_CLIENT_ID=inkcast-sync
      - INKCAST_KEYCLOAK_SYNC_SECRET_FILE=/var/run/secrets/inkcast/keycloak-sync-secret
      - INKCAST_KEYCLOAK_SYNC_INTERVAL=5
images:
  - name: ghcr.io/inkcasthq/inkcast
    newName: inkcast
    newTag: ci
patches:
  - target: {kind: Deployment, name: inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # The base allows egress to 443 only; this Keycloak listens on 8080 in its own namespace.
  - target: {kind: NetworkPolicy, name: inkcast}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: keycloak}
          ports:
            - {port: 8080, protocol: TCP}
            - {port: 8025, protocol: TCP}     # Mailpit's API: the sign-up test reads the verification email

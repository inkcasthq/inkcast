# oc new-project inkcast
# oc create secret generic inkcast-secrets --from-literal=secret-key="$(openssl rand -base64 48)" --from-literal=oidc-client-secret=... \
#   --from-literal=fga-api-token="$(openssl rand -base64 48)"   # OpenFGA's preshared key (components/openfga)
# oc apply -k deploy/kustomize/overlays/openshift            # needs the CloudNativePG operator (README, Hosted §2)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast
resources:
  - ../../base
  - route.yaml
configMapGenerator:
  # OpenFGA's store and the pinned model version (components/openfga sets the engine and the server's URL): write
  # them once with `inkcast authz write-model` and pin both here. Until then Inkcast refuses to start and names them.
  # A self-host that keeps the in-process engine instead leaves the component out and sets
  # INKCAST_AUTHZ_ENGINE=local with INKCAST_AUTHZ_ALLOW_LOCAL=true (README, Hosted §2).
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_FGA_STORE_ID=
      - INKCAST_FGA_MODEL_ID=
components:
  - ../../components/openfga            # permission checks: OpenFGA on CloudNativePG (E3.F3.9.S1)
  - ../../components/servicemonitor     # needs user-workload monitoring enabled
  - ../../components/metrics-access     # the metrics port: Prometheus pods only (#21)
  - ../../components/prometheus-rules   # alerts and SLO burn rates (generated: scripts/gen-alerts.py)
  - ../../components/backup             # daily SQLite backups to their own volume (until PostgreSQL, E3)
  # - ../../components/dashboards       # Grafana sidecar ConfigMap (generated: scripts/gen-dashboards.py)
  # - ../../components/egress-openshift # allow-list outbound hosts (OVN-Kubernetes EgressFirewall)
  # - ../../components/external-secrets # if secrets come from Vault / a cloud secret manager
patches:
  # No runAsUser/fsGroup, on Inkcast's pod or OpenFGA's: the restricted-v2 SCC assigns them per namespace.
  - target: {kind: NetworkPolicy, name: inkcast}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {policy-group.network.openshift.io/ingress: ""}
  - target: {kind: NetworkPolicy, name: inkcast-metrics}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {network.openshift.io/policy-group: monitoring}

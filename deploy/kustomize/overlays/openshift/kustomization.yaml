# oc new-project inkcast
# oc create secret generic inkcast-secrets --from-literal=secret-key="$(openssl rand -base64 48)" --from-literal=oidc-client-secret=... \
#   --from-literal=fga-api-token="$(openssl rand -base64 48)"   # OpenFGA's preshared key (components/openfga)
# oc apply -k deploy/kustomize/overlays/openshift            # needs the CloudNativePG operator (README, Hosted §2)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast
resources:
  - ../../base
  - route.yaml
  - trusted-ca.yaml                 # the cluster's CA bundle, injected (#308)
# OpenFGA's store and model version need no pinning here: the component's init container authz-model writes them
# when a pod starts, and Inkcast pins the version equal to its packaged model (E3.F3.9.S6). To hold a specific
# version instead, merge INKCAST_FGA_STORE_ID and INKCAST_FGA_MODEL_ID into inkcast-config: both set, they win. A
# self-host that keeps the in-process engine leaves the component out and sets INKCAST_AUTHZ_ENGINE=local with
# INKCAST_AUTHZ_ALLOW_LOCAL=true (README, Hosted §2).
components:
  - ../../components/openfga            # permission checks: OpenFGA on CloudNativePG (E3.F3.9.S1)
  - ../../components/servicemonitor     # needs user-workload monitoring enabled
  - ../../components/metrics-access     # the metrics port: Prometheus pods only (#21)
  - ../../components/prometheus-rules   # alerts and SLO burn rates (generated: scripts/gen-alerts.py)
  - ../../components/backup             # daily SQLite backups to their own volume (until PostgreSQL, E3)
  # - ../../components/dashboards       # Grafana sidecar ConfigMap (generated: scripts/gen-dashboards.py)
  # - ../../components/egress-openshift # allow-list outbound hosts (OVN-Kubernetes EgressFirewall)
  # - ../../components/external-secrets # if secrets come from Vault / a cloud secret manager
patches:
  # Outbound HTTPS (Keycloak, the platforms) trusts the injected bundle, not only the image's own CAs (#308). The
  # HTTP client reads SSL_CERT_FILE. The mount is not optional: until the operator fills the ConfigMap, the pod waits
  # in ContainerCreating rather than starting without the file. By label, so components/split-services' Deployments
  # (which replace the one named inkcast) get it too.
  - target: {kind: Deployment, labelSelector: app.kubernetes.io/name=inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: trusted-ca, configMap: {name: inkcast-trusted-ca, items: [{key: ca-bundle.crt, path: tls-ca-bundle.pem}]}}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: trusted-ca, mountPath: /etc/pki/ca-trust/extracted/pem, readOnly: true}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SSL_CERT_FILE, value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem}
  # The init container authz-model (components/openfga) reads the server's configuration, so it trusts the same CAs:
  # an OpenFGA or a secrets back-end reached over HTTPS works for both or for neither. By the label the component sets
  # on the Deployments that carry it, so a Deployment without it (the Gateway, or no component) is left alone.
  - target: {kind: Deployment, labelSelector: inkcast.io/authz-model=init-container}
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/volumeMounts/-
        value: {name: trusted-ca, mountPath: /etc/pki/ca-trust/extracted/pem, readOnly: true}
      - op: add
        path: /spec/template/spec/initContainers/0/env
        value: [{name: SSL_CERT_FILE, value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem}]
  # No runAsUser/fsGroup, on Inkcast's pod or OpenFGA's: the restricted-v2 SCC assigns them per namespace.
  - target: {kind: NetworkPolicy, name: inkcast}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {policy-group.network.openshift.io/ingress: ""}
  - target: {kind: NetworkPolicy, name: inkcast-metrics}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {network.openshift.io/policy-group: monitoring}

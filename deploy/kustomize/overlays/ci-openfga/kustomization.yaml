# Used only by CI (kind): the CI overlay plus the OpenFGA component (E3.F3.9.S1), in its own namespace so the other
# kind steps keep the in-process engine. Proves, through scripts/dev/openfga-e2e.sh, that the component applies
# under Pod Security "restricted", the migrate Job completes, Inkcast refuses to start until the store and model
# ids are pinned (naming them), `inkcast authz write-model` writes them once, and readiness passes against OpenFGA.
# The CloudNativePG operator is installed first (scripts/versions.env). The end-to-end suite on OpenFGA is F3.9.S3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast-openfga
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/openfga
secretGenerator:
  - name: inkcast-secrets
    options: {disableNameSuffixHash: true}
    literals:
      - secret-key=ci-only-not-a-secret-ci-only-not-a-secret-0123456789
      - oidc-client-secret=unused
      - password=ci-only-password-123
      - fga-api-token=ci-only-fga-preshared-key-0123456789   # the script reads it back from the Secret, never from here
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_PUBLIC_URL=http://localhost:8787
      - INKCAST_ENV=ci                  # the throwaway key below would fail the production posture checks
      - INKCAST_LOGIN=password
      - INKCAST_PASSWORD_FILE=/var/run/secrets/inkcast/password
      # Pinned by the script after `inkcast authz write-model`; empty here so the refusal is what CI sees first.
      - INKCAST_FGA_STORE_ID=
      - INKCAST_FGA_MODEL_ID=
images:
  - name: ghcr.io/inkcasthq/inkcast
    newName: inkcast
    newTag: ci
patches:
  - target: {kind: Deployment, name: inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

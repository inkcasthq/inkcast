# kubectl create namespace inkcast   (or keep namespace.yaml below)
# kubectl -n inkcast create secret generic inkcast-secrets --from-literal=secret-key=... --from-literal=oidc-client-secret=... \
#   --from-literal=fga-api-token=...                      # OpenFGA's preshared key (components/openfga)
# kubectl apply -k deploy/kustomize/overlays/kubernetes   # needs the CloudNativePG operator (README, Hosted §2)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkcast
resources:
  - namespace.yaml
  - ../../base
  - httproute.yaml
configMapGenerator:
  # OpenFGA's store and the pinned model version (components/openfga sets the engine and the server's URL): write
  # them once with `inkcast authz write-model` and pin both here. Until then Inkcast refuses to start and names them.
  # A self-host that keeps the in-process engine instead leaves the component out and sets
  # INKCAST_AUTHZ_ENGINE=local with INKCAST_AUTHZ_ALLOW_LOCAL=true (README, Hosted §2).
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_FGA_STORE_ID=
      - INKCAST_FGA_MODEL_ID=
components:
  - ../../components/openfga            # permission checks: OpenFGA on CloudNativePG (E3.F3.9.S1)
  - ../../components/servicemonitor
  - ../../components/metrics-access     # the metrics port: Prometheus pods only (#21)
  - ../../components/prometheus-rules   # alerts and SLO burn rates (generated: scripts/gen-alerts.py)
  - ../../components/backup             # daily SQLite backups to their own volume (until PostgreSQL, E3)
  # - ../../components/dashboards       # Grafana sidecar ConfigMap (generated: scripts/gen-dashboards.py)
  # - ../../components/egress-cilium    # FQDN allow-list for outbound calls (Cilium)
  # - ../../components/external-secrets
patches:
  - target: {kind: Deployment, name: inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
  - target: {kind: CronJob, name: inkcast-backup}
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
        value: 1001
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 1001
  - target: {kind: NetworkPolicy, name: inkcast}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {kubernetes.io/metadata.name: gateway-system}
  - target: {kind: NetworkPolicy, name: inkcast-metrics}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {kubernetes.io/metadata.name: monitoring}

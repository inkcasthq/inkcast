# Default-deny for the Inkcast pods, then only what they need.
# Overlays set which namespaces count as "ingress". The metrics port is admitted by its own policy in the
# metrics-access component (inkcast-metrics), to Prometheus pods only: not here, because the base's label transform
# (includeSelectors) would rewrite a pod selector in this file to app.kubernetes.io/name=inkcast (#21).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inkcast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              inkcast.io/ingress: "true"        # patched per platform in the overlays
      ports:
        - {port: 8787, protocol: TCP}
  egress:
    - ports:                                     # DNS
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 5353, protocol: UDP}           # OpenShift DNS
        - {port: 5353, protocol: TCP}
    - ports:                                     # platform APIs and the identity provider (HTTPS only)
        - {port: 443, protocol: TCP}
      # Tighten to named hosts with the egress-cilium or egress-openshift component.

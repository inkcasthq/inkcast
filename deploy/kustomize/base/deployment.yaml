apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkcast
spec:
  replicas: 1                 # SQLite: exactly one writer. With PostgreSQL: split into web (N) + worker (1..N).
  strategy:
    type: Recreate            # never two pods on the same SQLite file
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: inkcast
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40   # INKCAST_SHUTDOWN_GRACE (25) stays under it (libs/config.SHUTDOWN_GRACE_CEILING), so in-flight posts finish
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inkcast
          image: inkcast
          args: ["all"]
          ports:
            - name: http
              containerPort: 8787
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: inkcast-config
          env:
            - name: INKCAST_SECRET_KEY_FILE
              value: /var/run/secrets/inkcast/secret-key
            - name: OIDC_CLIENT_SECRET_FILE
              value: /var/run/secrets/inkcast/oidc-client-secret
          startupProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /var/run/secrets/inkcast, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inkcast-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: inkcast-secrets   # keys: secret-key, oidc-client-secret
            defaultMode: 0440

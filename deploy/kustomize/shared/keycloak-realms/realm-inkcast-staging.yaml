# GENERATED by scripts/gen-realm-imports.py from deploy/keycloak/realm-inkcast.json and the environment's
# kustomization. Do not edit: change the realm file or the environment, then run the script (#305).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: inkcast-staging
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-realm
    app.kubernetes.io/part-of: inkcast
    app.kubernetes.io/component: identity
    inkcast.io/environment: staging
spec:
  keycloakCRName: keycloak
  placeholders:
    KC_INKCAST_CLIENT_SECRET:
      secret:
        name: inkcast-staging-realm
        key: identity-client-secret
    KC_INKCAST_SYNC_SECRET:
      secret:
        name: inkcast-staging-realm
        key: sync-client-secret
  realm:
    realm: inkcast-staging
    displayName: Inkcast
    enabled: true
    sslRequired: external
    registrationAllowed: true
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    verifyEmail: true
    resetPasswordAllowed: true
    editUsernameAllowed: false
    rememberMe: false
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    waitIncrementSeconds: 60
    maxFailureWaitSeconds: 900
    passwordPolicy: length(12) and notUsername and notEmail
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    eventsEnabled: true
    enabledEventTypes:
    - LOGIN
    - LOGIN_ERROR
    - REGISTER
    - REGISTER_ERROR
    - LOGOUT
    - UPDATE_PASSWORD
    - VERIFY_EMAIL
    - DELETE_ACCOUNT
    adminEventsEnabled: true
    adminEventsDetailsEnabled: false
    eventsExpiration: 604800
    roles:
      realm:
      - name: inkcast-user
        description: May use Inkcast. Given to every account by default.
      - name: inkcast-admin
        description: 'Inkcast operators: the admin portal (E6). Requires OTP or WebAuthn (E9.F9.4).'
      - name: default-roles-inkcast
        description: 'Roles every new account gets: inkcast-user, and the account client''s delete-account (E9.F9.5.S4: a
          person may delete their own account).'
        composite: true
        composites:
          realm:
          - inkcast-user
          client:
            account:
            - delete-account
    defaultRole:
      name: default-roles-inkcast
    clients:
    - clientId: inkcast-identity
      name: Inkcast sign-in (MCP clients, the API, personal access tokens)
      description: Confidential client for Inkcast's IdentityService. Secret from KC_INKCAST_CLIENT_SECRET, never in Git.
      enabled: true
      protocol: openid-connect
      publicClient: false
      clientAuthenticatorType: client-secret
      secret: ${KC_INKCAST_CLIENT_SECRET}
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      frontchannelLogout: true
      redirectUris:
      - https://inkcast-staging.apps-crc.testing/auth/callback
      baseUrl: https://inkcast-staging.apps-crc.testing/account/return
      webOrigins:
      - https://inkcast-staging.apps-crc.testing
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://inkcast-staging.apps-crc.testing/
      fullScopeAllowed: true
      defaultClientScopes:
      - profile
      - email
      - roles
      - web-origins
      optionalClientScopes:
      - offline_access
    - clientId: inkcast-sync
      name: Inkcast user sync (service account)
      description: 'Confidential, service account only: Inkcast''s IdentityService reads users and admin events to cut off
        people disabled or deleted here (E9.F9.5.S2). Secret from KC_INKCAST_SYNC_SECRET, never in Git.'
      enabled: true
      protocol: openid-connect
      publicClient: false
      clientAuthenticatorType: client-secret
      secret: ${KC_INKCAST_SYNC_SECRET}
      standardFlowEnabled: false
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      frontchannelLogout: false
      redirectUris: []
      webOrigins: []
      attributes:
        access.token.lifespan: '300'
    users:
    - username: service-account-inkcast-sync
      enabled: true
      serviceAccountClientId: inkcast-sync
      clientRoles:
        realm-management:
        - view-users
        - view-events
    requiredActions:
    - alias: TERMS_AND_CONDITIONS
      name: Terms and Conditions
      providerId: TERMS_AND_CONDITIONS
      enabled: true
      defaultAction: true
      priority: 10
      config: {}
    - alias: VERIFY_EMAIL
      name: Verify Email
      providerId: VERIFY_EMAIL
      enabled: true
      defaultAction: false
      priority: 20
      config: {}
    - alias: UPDATE_PASSWORD
      name: Update Password
      providerId: UPDATE_PASSWORD
      enabled: true
      defaultAction: false
      priority: 30
      config: {}
    - alias: UPDATE_PROFILE
      name: Update Profile
      providerId: UPDATE_PROFILE
      enabled: true
      defaultAction: false
      priority: 40
      config: {}
    - alias: CONFIGURE_TOTP
      name: Configure OTP
      providerId: CONFIGURE_TOTP
      enabled: true
      defaultAction: false
      priority: 50
      config: {}
    - alias: webauthn-register
      name: Webauthn Register
      providerId: webauthn-register
      enabled: true
      defaultAction: false
      priority: 60
      config: {}
    - alias: delete_account
      name: Delete Account
      providerId: delete_account
      enabled: true
      defaultAction: false
      priority: 70
      config: {}
    smtpServer:
      host: mailpit.keycloak.svc
      port: '1025'
      from: no-reply@inkcast-staging.apps-crc.testing
      fromDisplayName: Inkcast
      auth: 'false'
      starttls: 'false'
      ssl: 'false'
    attributes:
      adminEventsExpiration: '604800'

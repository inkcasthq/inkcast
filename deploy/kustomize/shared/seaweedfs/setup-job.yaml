# The credential, generated in the cluster (setup.sh, mounted from the ConfigMap kustomization.yaml generates): one
# key pair for Velero's identity, written as the identities file the store reads (inkcast-seaweedfs/
# seaweedfs-s3-identities, key identities.json) and as the AWS credentials file Velero reads (openshift-adp/
# cloud-credentials-root-secrets, key cloud). A pair, as env-secrets' pairs: a side that exists is kept, a side
# that is absent is copied from the other, two sides that disagree fail the run naming them, and only when both
# are absent is a value drawn, from the kernel's CSPRNG. Then the Job waits for the store and checks that the
# bucket exists. Nothing it prints is a value.
#
# The store's own image, which carries `curl` for the API server and `weed` for the bucket check (docker/
# Dockerfile.go_build at 4.52: alpine, `apk add ... curl`), with `command` set so the image's entrypoint (which
# prefixes `weed`) is not used. The token is projected into this container alone, valid ten minutes, with the
# cluster's CA and the namespace, at the path in-cluster clients read, and the script sends it as a header read
# from a file, never as an argument. /tmp is memory, never a disk: the values pass through it while the pod runs.
# Restricted as the store's pod: an arbitrary uid, a read-only root filesystem, every capability dropped.
#
# A Job's template is immutable: scripts/lab/root-secret-copy.sh removes a finished Job before it applies again,
# and a later run keeps what the first made. Bounded: four retries within a run, a quarter of an hour in all.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-setup
  labels: {app.kubernetes.io/name: seaweedfs-setup, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs-setup, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
    spec:
      restartPolicy: Never
      serviceAccountName: seaweedfs-setup
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          command: ["/bin/sh", "/opt/inkcast/setup.sh"]
          env:
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: setup, mountPath: /opt/inkcast, readOnly: true}
            - {name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap: {name: seaweedfs-setup}
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}

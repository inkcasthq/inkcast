# Who may reach the store's pod:
#   - Velero's pod in openshift-adp, on the S3 port alone. The operator labels it app.kubernetes.io/name=velero
#     (internal/controller/velero.go at oadp-1.6: the Deployment's labels, which the pod template starts from;
#     measured on the lab in the pull request).
#   - the setup Job's pod in this namespace, on S3, the master and the filer (HTTP and gRPC: `weed shell` lists the
#     bucket through them, setup.sh).
# Nothing else: no other namespace, no other pod. The kubelet's probes come from the node, outside NetworkPolicy on
# OVN-Kubernetes, as the shared database's policy already relies on (shared/inkcast-db/networkpolicy.yaml). Egress
# is not restricted: the store makes no connection of its own (telemetry is off), the Job reaches the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-adp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: velero
      ports:
        - {port: 8333, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: seaweedfs-setup, app.kubernetes.io/part-of: inkcast}
      ports:
        - {port: 8333, protocol: TCP}
        - {port: 9333, protocol: TCP}
        - {port: 19333, protocol: TCP}
        - {port: 8888, protocol: TCP}
        - {port: 18888, protocol: TCP}

# SeaweedFS as one process (`weed mini`: master, volume server, filer and the S3 gateway in one pod), serving S3 on
# 8333 to Velero and nothing else (networkpolicy.yaml). Apache-2.0, published on Docker Hub by its project under a
# release tag, pinned by digest (scripts/images.py), unqualified as Mailpit's image is (shared/keycloak-realms):
# the node's registry search list resolves it. Chosen on 2026-11-04 after MinIO's community images and binaries
# were withdrawn (ADR-0020 has the measurements).
#
# The arguments: `-bucket` creates the bucket at every start when it is absent and keeps it when it exists
# (weed/command/mini.go at 4.52, ensureMiniBuckets), so the bucket is declared here, not made by a client.
# `-s3.config` names the identities file, read once at start (weed/s3api/auth_credentials.go: a file's identities
# are static), from the Secret seaweedfs-s3-identities the setup Job generates: one identity, `velero`, allowed
# Read, Write and List on that bucket and nothing on any other (CanDo matches `Action:bucket`); with a file present
# every anonymous request is refused. A changed Secret takes `oc -n inkcast-seaweedfs rollout restart
# deploy/seaweedfs`. Off: everything `mini` starts that is not S3 (WebDAV, the admin UI, the Iceberg and Lance
# catalogs) and the project's anonymous telemetry report.
#
# Restricted as the repository's other pods: the image declares no USER and its entrypoint drops privileges only
# when it starts as root (docker/entrypoint.sh at 4.52), so the restricted-v2 SCC's arbitrary uid runs it as it is;
# a read-only root filesystem with the data volume and /tmp (the filer's and the gateway's local sockets) writable;
# every capability dropped. Recreate: one ReadWriteOnce volume, never two pods on it. Requests sized for one
# Secret a day; the lab's node holds both environments in its memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          args:
            - mini
            - -dir=/data
            - -s3.config=/etc/seaweedfs/identities.json
            - -bucket=inkcast-root-secrets
            - -webdav=false
            - -admin.ui=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
          env:
            - {name: HOME, value: /tmp}
          ports:
            - {name: s3, containerPort: 8333}
            - {name: master, containerPort: 9333}
            - {name: master-grpc, containerPort: 19333}
            - {name: filer, containerPort: 8888}
            - {name: filer-grpc, containerPort: 18888}
          readinessProbe:
            httpGet: {path: /cluster/status, port: master}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /cluster/status, port: master}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: identities, mountPath: /etc/seaweedfs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: identities
          secret: {secretName: seaweedfs-s3-identities, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

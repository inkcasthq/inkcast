# The identity the setup Job writes the two credential Secrets as: its own, so no other pod holds its rights (the
# store's pod runs as the namespace's default account and reads nothing from the API). No token is mounted from it
# by default: the Job projects one into its own container alone (setup-job.yaml), as components/env-secrets does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-setup
  labels: {app.kubernetes.io/name: seaweedfs-setup, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
automountServiceAccountToken: false

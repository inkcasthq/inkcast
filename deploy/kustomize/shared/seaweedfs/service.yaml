# The store's name: Velero's storage location names `http://seaweedfs.inkcast-seaweedfs.svc:8333` (shared/oadp/
# dpa.yaml); the setup Job reaches the master and the filer through it to check the bucket (setup.sh). The policy
# beside it decides who may (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast, app.kubernetes.io/component: root-secret-store}
spec:
  selector: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: inkcast}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
    - {name: master, port: 9333, targetPort: master}
    - {name: master-grpc, port: 19333, targetPort: master-grpc}
    - {name: filer, port: 8888, targetPort: filer}
    - {name: filer-grpc, port: 18888, targetPort: filer-grpc}

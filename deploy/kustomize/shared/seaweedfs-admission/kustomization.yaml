# The setup Job of the lab's root Secret store (shared/seaweedfs) creates two Secrets, and RBAC cannot narrow
# `create` to a name or a type ("the name of the new object may not be known at authorization time", Kubernetes,
# "Using RBAC Authorization"). Without this policy the account could create, under the name Velero's storage
# location reads while that Secret is absent, a Secret of type kubernetes.io/service-account-token annotated for
# Velero's service account, let the token controller fill it, and read it back by name: Velero's account holds
# `*` on every resource and the privileged SCC (OADP 1.6.2's CSV). This admission policy does the narrowing, as
# shared/env-secrets-admission does for `inkcast env-secrets`: that account creates only Opaque Secrets, only under
# the two names, with no service-account annotation. Cluster-scoped, so a kustomization of its own with no
# `namespace:`. Applied before shared/seaweedfs-access and shared/seaweedfs, so the account's `create` is never in
# force without it (scripts/lab/root-secret-copy.sh, which also proves the denial with a server-side dry run).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policy.yaml

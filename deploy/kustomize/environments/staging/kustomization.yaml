# GitOps entry point for staging (Argo CD / Flux watch this directory).
# The image is pinned BY DIGEST; .github/workflows/promote.yml updates it in a pull request
# only after verifying the image's cosign signature and SLSA provenance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../overlays/openshift      # or ../../overlays/kubernetes
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_ENV=staging       # same checks as production, but a weak key or a reveal flag only warns
images:
  - name: ghcr.io/inkcasthq/inkcast
    digest: sha256:9319f6d63f054c8dfb56253a88cf5e5a75e38ea52058189d27681a91484c1c11

# GitOps entry point for staging (Argo CD / Flux watch this directory; the lab applies it with `oc apply -k`).
# The image is pinned BY DIGEST; .github/workflows/promote.yml updates it in a pull request
# only after verifying the image's cosign signature and SLSA provenance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Its own namespace beside production's (#296): the overlay's `inkcast` is overridden here. The lab's bring-up order
# (the shared database and Keycloak access, the pull Secret, then this) is in the README, Hosted §2.
namespace: inkcast-staging
resources:
  - ../../overlays/openshift      # or ../../overlays/kubernetes
components:
  # Every generated Secret (inkcast-secrets, openfga-db-app, and their pairs in inkcast-db and keycloak), made by the
  # init container of OpenFGA's pod at each start: no secret step (#323).
  - ../../components/env-secrets
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      # Where this environment lives on OpenShift Local (apps domain apps-crc.testing), each name suffixed -staging
      # (#305): its own public URL (the Route host below) and its own realm on the lab's Keycloak, whose client is
      # inkcast-identity (deploy/keycloak/realm-inkcast.json).
      - INKCAST_PUBLIC_URL=https://inkcast-staging.apps-crc.testing
      - OIDC_ISSUER=https://keycloak.apps-crc.testing/realms/inkcast-staging
      - OIDC_CLIENT_ID=inkcast-identity
      # The user sync (E9.F9.5.S2; #305, D2: on in both environments), as the realm's inkcast-sync service account. Its
      # secret is the realm Secret's sync-client-secret, which env-secrets (#323) also writes into inkcast-secrets as
      # keycloak-sync-secret, mounted with the other secrets (deploy/kustomize/base/deployment.yaml).
      - INKCAST_KEYCLOAK_SYNC_CLIENT_ID=inkcast-sync
      - INKCAST_KEYCLOAK_SYNC_SECRET_FILE=/var/run/secrets/inkcast/keycloak-sync-secret
      - INKCAST_ENV=staging       # same checks as production, but a weak key or a reveal flag only warns
      # Staging rehearses production: OpenFGA (components/openfga, through the overlay), never the in-process engine.
      # The store and the model version are written by the pods (E3.F3.9.S6): the init container authz-model runs
      # `inkcast authz write-model` with the pod's own image before the server, which then pins the store named here
      # and its version equal to the packaged model. The component's default name, stated so it is a choice: one
      # OpenFGA per namespace. A model change travels with the image; a rollback is the image's revert. To hold one
      # version by hand instead, pin INKCAST_FGA_STORE_ID and INKCAST_FGA_MODEL_ID here: both set, they win, nothing
      # is resolved and the init container writes nothing.
      - INKCAST_AUTHZ_ENGINE=openfga
      - INKCAST_AUTHZ_ALLOW_LOCAL=false
      - INKCAST_FGA_STORE_NAME=inkcast
      # A person gone from Keycloak (deleted by an administrator, or a self-deletion whose event the sync never saw)
      # is cut off at once and erased this many days later (E9.F9.5.S6). 0 erases at the first reconcile; off never
      # erases on a 404, which the posture check warns about here. The default is 30: stated so it is a choice.
      - INKCAST_KEYCLOAK_ERASE_AFTER_DAYS=30
      # The sync's circuit breaker (E9.F9.5.S7): a reconcile that finds at least BREAKER_MIN people, and more than
      # BREAKER_PERCENT of those it read, gone from Keycloak at once holds them all for an operator (inkcast identity
      # confirm-deletions) instead of cutting everyone off. off is a posture warning here. The defaults: stated as a choice.
      - INKCAST_KEYCLOAK_BREAKER=on
      - INKCAST_KEYCLOAK_BREAKER_PERCENT=10
      - INKCAST_KEYCLOAK_BREAKER_MIN=5
      # Personal access tokens (F1.10.S2): production's values, so staging rehearses the same policy.
      - INKCAST_PAT_DEFAULT_DAYS=90
      - INKCAST_PAT_MAX_DAYS=366
      - INKCAST_PAT_ALLOW_NO_EXPIRY=true
      # Retention (F1.10.S3): production's values, so staging rehearses the same replay window and hourly history.
      - INKCAST_OUTBOX_RETENTION_DAYS=7
      - INKCAST_KPI_HOURLY_RETENTION_DAYS=90
      # The recovery cap (#216): production's value, so staging rehearses the same policy.
      - INKCAST_PUBLISH_RECOVERY_MAX_HOURS=24
      # The intervals, the overdue grace, the rate limit and the backup copies (F1.10.S5, #157): production's values,
      # so staging rehearses the same timing and posture. Each is bounded at start-up (README, Configuration).
      - INKCAST_KEYCLOAK_SYNC_INTERVAL=30
      - INKCAST_KEYCLOAK_RECONCILE_INTERVAL=600
      - INKCAST_SCHEDULER_INTERVAL=20
      - INKCAST_OVERDUE_GRACE=600
      - INKCAST_INSIGHTS_INTERVAL=10
      - INKCAST_SHUTDOWN_GRACE=25
      - INKCAST_RATE_LIMIT_PER_MINUTE=60
      - INKCAST_BACKUP_KEEP=14           # the backup CronJob's value (components/backup): change both together
images:
  - name: ghcr.io/inkcasthq/inkcast
    digest: sha256:8dd73e6a8c7356f3af97663411c30774b26dead243ac0e30319da844a277b1af
patches:
  # The Route's host matches INKCAST_PUBLIC_URL above: one host per environment, so both Routes are admitted on one
  # cluster (#305).
  - target: {kind: Route, name: inkcast}
    patch: |-
      - op: replace
        path: /spec/host
        value: inkcast-staging.apps-crc.testing
  # The lab's two environments share one PostgreSQL (deploy/kustomize/shared/inkcast-db, #296): the component's
  # per-namespace Cluster is dropped here, and OpenFGA's Deployment and migrate Job read the Secret openfga-db-app
  # that components/env-secrets creates, pointing at the shared cluster. The kubernetes, openshift and ci-openfga
  # overlays keep the Cluster: a self-host or CI gets its own database from the component alone.
  - target: {kind: Cluster, name: openfga-db}
    patch: |-
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: openfga-db
  # ghcr.io/inkcasthq/inkcast is private: the pull Secret ghcr-pull (scripts/deploy/ghcr-pull-secret.sh) is named
  # both ways, and either alone pulls. On the ServiceAccount every Inkcast-image pod runs as (the field that
  # `oc secrets link --for=pull` would write), which covers pods added later; and on each workload's pod spec, which
  # covers a pod whose ServiceAccount is not wired. Only here, never in the overlays: a self-host pulls its own image.
  # When the package goes public, these three patches, the two in components/env-secrets and the Secret go (README,
  # Hosted §2).
  - target: {kind: ServiceAccount, name: inkcast}
    patch: |-
      - op: add
        path: /imagePullSecrets
        value: [{name: ghcr-pull}]
  - target: {kind: Deployment, name: inkcast}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
  - target: {kind: CronJob, name: inkcast-backup}
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]

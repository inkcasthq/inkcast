# GitOps entry point for staging (Argo CD / Flux watch this directory).
# The image is pinned BY DIGEST; .github/workflows/promote.yml updates it in a pull request
# only after verifying the image's cosign signature and SLSA provenance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../overlays/openshift      # or ../../overlays/kubernetes
configMapGenerator:
  - name: inkcast-config
    behavior: merge
    literals:
      - INKCAST_ENV=staging       # same checks as production, but a weak key or a reveal flag only warns
      # Staging rehearses production: no in-process authorization engine (the self-host overlay it builds on allows
      # one). It doesn't start until INKCAST_AUTHZ_ENGINE=openfga and its INKCAST_FGA_* settings land (E3.F3.9).
      - INKCAST_AUTHZ_ALLOW_LOCAL=false
      # A person gone from Keycloak (deleted by an administrator, or a self-deletion whose event the sync never saw)
      # is cut off at once and erased this many days later (E9.F9.5.S6). 0 erases at the first reconcile; off never
      # erases on a 404, which the posture check warns about here. The default is 30: stated so it is a choice.
      - INKCAST_KEYCLOAK_ERASE_AFTER_DAYS=30
      # The sync's circuit breaker (E9.F9.5.S7): a reconcile that finds at least BREAKER_MIN people, and more than
      # BREAKER_PERCENT of those it read, gone from Keycloak at once holds them all for an operator (inkcast identity
      # confirm-deletions) instead of cutting everyone off. off is a posture warning here. The defaults: stated as a choice.
      - INKCAST_KEYCLOAK_BREAKER=on
      - INKCAST_KEYCLOAK_BREAKER_PERCENT=10
      - INKCAST_KEYCLOAK_BREAKER_MIN=5
      # Personal access tokens (F1.10.S2): production's values, so staging rehearses the same policy.
      - INKCAST_PAT_DEFAULT_DAYS=90
      - INKCAST_PAT_MAX_DAYS=366
      - INKCAST_PAT_ALLOW_NO_EXPIRY=true
      # Retention (F1.10.S3): production's values, so staging rehearses the same replay window and hourly history.
      - INKCAST_OUTBOX_RETENTION_DAYS=7
      - INKCAST_KPI_HOURLY_RETENTION_DAYS=90
      # The recovery cap (#216): production's value, so staging rehearses the same policy.
      - INKCAST_PUBLISH_RECOVERY_MAX_HOURS=24
      # The intervals, the overdue grace, the rate limit and the backup copies (F1.10.S5, #157): production's values,
      # so staging rehearses the same timing and posture. Each is bounded at start-up (README, Configuration).
      - INKCAST_KEYCLOAK_SYNC_INTERVAL=30
      - INKCAST_KEYCLOAK_RECONCILE_INTERVAL=600
      - INKCAST_SCHEDULER_INTERVAL=20
      - INKCAST_OVERDUE_GRACE=600
      - INKCAST_INSIGHTS_INTERVAL=10
      - INKCAST_SHUTDOWN_GRACE=25
      - INKCAST_RATE_LIMIT_PER_MINUTE=60
      - INKCAST_BACKUP_KEEP=14           # the backup CronJob's value (components/backup): change both together
images:
  - name: ghcr.io/inkcasthq/inkcast
    digest: sha256:57b0bc500f603fb81839083c1dbf3680c9f75848891036180ec26bdcd384ebb0

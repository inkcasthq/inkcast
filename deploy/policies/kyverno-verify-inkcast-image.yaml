# Admission-time supply-chain check (Kyverno): only run Inkcast images that were signed by this
# repository's publish workflow (keyless, GitHub OIDC) and carry an SPDX SBOM attestation.
# Adjust the org/repo and registry if they change. Validate against your Kyverno version before enforcing:
# start with validationFailureAction: Audit.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-inkcast-image
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  rules:
    - name: signed-by-publish-workflow
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [inkcast]
      verifyImages:
        - imageReferences: ["ghcr.io/inkcasthq/inkcast*"]
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/inkcasthq/inkcast/.github/workflows/publish.yml@refs/*
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://spdx.dev/Document
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/inkcasthq/inkcast/.github/workflows/publish.yml@refs/*
                        rekor:
                          url: https://rekor.sigstore.dev

# Development and CI only: one Keycloak in start-dev mode (in-memory H2, HTTP) with the inkcast realm imported at
# startup. Production runs Keycloak on PostgreSQL, two or more replicas, TLS (docs: deploy/keycloak/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: {app.kubernetes.io/name: keycloak}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          args: ["start-dev", "--import-realm"]
          env:
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: admin-password}}
            # Filled into the realm's ${...} placeholders at import (realm-inkcast.json).
            - name: KC_INKCAST_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: inkcast-client-secret}}
            - name: KC_INKCAST_SYNC_SECRET              # the inkcast-sync service account (E9.F9.5.S2)
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: inkcast-sync-secret}}
            - name: INKCAST_PUBLIC_URL
              valueFrom: {configMapKeyRef: {name: keycloak-realm-settings, key: INKCAST_PUBLIC_URL}}
            # SMTP for verification and password-reset emails (realm smtpServer placeholders). Dev: Mailpit, no auth.
            - name: KC_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: smtp-password}}
          envFrom:
            - configMapRef: {name: keycloak-smtp}       # KC_SMTP_HOST, _PORT, _FROM, _AUTH, _USER, _STARTTLS, _SSL
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Development and CI only: Mailpit catches Keycloak's emails (verification, password reset) and shows them through an
# API (http://mailpit.keycloak.svc:8025/api/v1), so the sign-up test can follow the link a person would click.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: keycloak
  labels: {app.kubernetes.io/name: mailpit}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.28.3
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}              # its message store (a temporary file)
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: keycloak
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}

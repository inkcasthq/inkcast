# Development and CI only: one Keycloak in start-dev mode (in-memory H2, HTTP) with the inkcast realm imported at
# startup. Production runs Keycloak on PostgreSQL, two or more replicas, TLS (docs: deploy/keycloak/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: {app.kubernetes.io/name: keycloak}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          args: ["start-dev", "--import-realm"]
          env:
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: admin-password}}
            # Filled into the realm's ${...} placeholders at import (realm-inkcast.json).
            - name: KC_INKCAST_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: inkcast-client-secret}}
            - name: INKCAST_PUBLIC_URL
              valueFrom: {configMapKeyRef: {name: keycloak-realm-settings, key: INKCAST_PUBLIC_URL}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}

id: E9
title: Identity on Keycloak
status: next
goal: Keycloak is the single identity layer of the SaaS (sign-up, social login, MFA, enterprise SSO); Inkcast keeps MCP OAuth, consent and tokens (ADR-0006). Needed before E4 and E6.
features:

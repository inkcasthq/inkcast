# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E9
title: Identity on Keycloak
status: in-progress
goal: Keycloak is the single identity layer of the SaaS (sign-up, social login, MFA, enterprise SSO); Inkcast keeps MCP OAuth,
  consent and tokens (ADR-0006). Needed before E4 and E6.
features:
- id: F9.1
  title: Realm as code and real Keycloak in CI
  stories:
  - id: F9.1.S1
    title: Realm export deploy/keycloak/realm-inkcast.json (clients, roles, policies; no secrets)
    status: done
    change: 'built in PR #14'
    acceptance:
    - 'deploy/keycloak/realm-inkcast.json: realm, roles, the inkcast-identity client; no secret or person in Git'
    - Secrets and URLs through ${...} placeholders filled at import; tests/test_keycloak_realm.py keeps it so
  - id: F9.1.S2
    title: 'kind CI: Keycloak with the realm; end-to-end sign-in against it in single and split mode'
    status: done
    change: 'single mode in PR #14; split mode on kind in PR #23 (fixed #17)'
    acceptance:
    - The kind CI job deploys Keycloak with the realm and checks the placeholders were filled
    - A person with inkcast-user signs in through Keycloak's own login page end to end and reaches /api/v1/me
    - A person without the role is refused by Inkcast after Keycloak accepted the password
    - The same driver (scripts/dev/oidc_signin.py) is tested against a Keycloak-shaped fake in single and split mode
    - Split mode against the real Keycloak on kind
  - id: F9.1.S3
    title: Kustomize component for Keycloak (dev) and docs for a production Keycloak on Postgres
    status: in-progress
    change: 'dev Kustomize and production notes in PR #14; a production component waits for ADR-0014''s PostgreSQL'
- id: F9.2
  title: Self sign-up
  stories:
  - id: F9.2.S1
    title: Registration, email verification, terms; default role inkcast-user
    status: done
    change: 'built in PR #19'
    acceptance:
    - A newcomer registers on Keycloak's own page, verifies the emailed link and accepts the terms, then reaches Inkcast's
      /api/v1/me with the default inkcast-user role (kind CI, real Keycloak and Mailpit)
    - A newcomer who never verifies never reaches Inkcast
    - The realm declares every required action it relies on (listing them replaces Keycloak's defaults); SMTP settings are
      placeholders, no SMTP secret in Git
    - The driver is tested against a Keycloak-shaped fake (registration, verification email, terms) in single and split mode
  - id: F9.2.S2
    title: First login creates the Inkcast user and their personal organization (owner tuple; emits org.created)
    status: planned
    change: needs E3's organizations (F3.2) for the personal organization; the Inkcast user is already created at first login
- id: F9.3
  title: Social login and account linking
  stories:
  - id: F9.3.S1
    title: Google, GitHub, Microsoft identity providers (secrets from Kubernetes Secrets)
    status: planned
  - id: F9.3.S2
    title: First-broker-login flow links by verified email; manual verification runbook
    status: planned
- id: F9.4
  title: MFA and operators
  stories:
  - id: F9.4.S1
    title: inkcast-admin requires OTP or WebAuthn; admin client enforces it
    status: planned
- id: F9.5
  title: Identity and membership sync
  stories:
  - id: F9.5.S1
    title: IdentitySync consumes Keycloak user and Organization events (membership, admins) and writes tuples (ADR-0008)
    status: planned
    change: refined
  - id: F9.5.S2
    title: 'Disabled or deleted user: revoke OAuth tokens and PATs, delete tuples, refuse sign-in (tested with real Keycloak)'
    status: done
    change: 'built in the user-sync PR (tokens, PATs, codes); tuples are deleted by E3.F3.8 once OpenFGA holds any'
    acceptance:
    - 'IdentityService polls Keycloak as the inkcast-sync service account (view-users, view-events only): USER admin
      events every INKCAST_KEYCLOAK_SYNC_INTERVAL (30 s), and a full reconcile every INKCAST_KEYCLOAK_RECONCILE_INTERVAL
      (10 min) and at start, so a missed event or an account-console deletion is still caught'
    - A person disabled or deleted in Keycloak loses every OAuth token, code and personal access token in one
      transaction; token lookups also refuse anything minted for them in the moment of the cut-off
    - They sign in again once Keycloak allows it; their old tokens stay dead
    - 'Events identity.user.disabled and identity.sync.failed; metrics inkcast_identity_sync_total{result} and
      inkcast_identity_users_disabled_total{reason}; alert InkcastIdentitySyncFailing'
    - 'kind CI: an administrator disables ada with kcadm; her OAuth token and PAT answer 401 within 60 s; re-enabled,
      she signs in again'
  - id: F9.5.S3
    title: Scheduled reconcile of Keycloak membership against OpenFGA; a missed event still removes access; drift alert
    status: planned
    change: new
  - id: F9.5.S4
    title: The user sync also reads user events (DELETE_ACCOUNT from the account console), so a self-deleted account is
      cut off within a minute, not at the next reconcile
    status: planned
    change: 'new; issue #41'
    acceptance:
    - The realm records DELETE_ACCOUNT user events; the sync reads them with its own cursor beside the admin-events one
    - The inkcast-sync service account still needs only view-users and view-events
    - The fake and the kind e2e delete an account through the account API and expect 401 on its tokens within 60 s
  - id: F9.5.S5
    title: The user sync proven in split mode on kind (IdentityService's own Deployment carries the sync settings)
    status: planned
    change: 'new; issue #42'
    acceptance:
    - ci-split-oidc sets INKCAST_KEYCLOAK_SYNC_* and the secret on the IdentityService Deployment only
    - keycloak-e2e.sh runs the disable, 401, re-enable check through the Gateway as it does in single mode
- id: F9.6
  title: Enterprise SSO
  stories:
  - id: F9.6.S1
    title: 'Keycloak Organizations for enterprise SSO: domain to customer IdP; Organization id = organization:<id> in OpenFGA'
    status: planned
    change: refined
- id: F9.7
  title: Operations
  stories:
  - id: F9.7.S1
    title: 'Runbook: realm upgrades, signing-key rotation, backup and restore'
    status: planned
  - id: F9.7.S2
    title: 'Keycloak event retention in the realm: eventsExpiration and adminEventsExpiration (7 days)'
    status: planned
    change: 'new; issue #43'
    acceptance:
    - realm-inkcast.json sets both; tests/test_keycloak_realm.py keeps them set and at least 1 day (the sync reads from
      the day before its cursor)
    - The kind e2e reads the imported realm and checks both values

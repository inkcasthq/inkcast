# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E9
title: Identity on Keycloak
status: next
goal: Keycloak is the single identity layer of the SaaS (sign-up, social login, MFA, enterprise SSO); Inkcast keeps MCP OAuth,
  consent and tokens (ADR-0006). Needed before E4 and E6.
features:
- id: F9.1
  title: Realm as code and real Keycloak in CI
  stories:
  - id: F9.1.S1
    title: Realm export deploy/keycloak/realm-inkcast.json (clients, roles, policies; no secrets)
    status: in-progress
    change: 'built in PR #14 (mark done when it merges)'
    acceptance:
    - 'deploy/keycloak/realm-inkcast.json: realm, roles, the inkcast-identity client; no secret or person in Git'
    - Secrets and URLs through ${...} placeholders filled at import; tests/test_keycloak_realm.py keeps it so
  - id: F9.1.S2
    title: 'kind CI: Keycloak with the realm; end-to-end sign-in against it in single and split mode'
    status: in-progress
    change: 'built in PR #14 for single mode on kind; split mode on kind still to do'
    acceptance:
    - The kind CI job deploys Keycloak with the realm and checks the placeholders were filled
    - A person with inkcast-user signs in through Keycloak's own login page end to end and reaches /api/v1/me
    - A person without the role is refused by Inkcast after Keycloak accepted the password
    - The same driver (scripts/dev/oidc_signin.py) is tested against a Keycloak-shaped fake in single and split mode
    - Split mode against the real Keycloak on kind
  - id: F9.1.S3
    title: Kustomize component for Keycloak (dev) and docs for a production Keycloak on Postgres
    status: in-progress
    change: 'dev Kustomize and production notes in PR #14; a production component waits for ADR-0014''s PostgreSQL'

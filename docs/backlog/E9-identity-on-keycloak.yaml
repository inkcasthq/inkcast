# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E9
title: Identity on Keycloak
status: in-progress
goal: Keycloak is the single identity layer of the SaaS (sign-up, social login, MFA, enterprise SSO); Inkcast keeps MCP OAuth,
  consent and tokens (ADR-0006). Needed before E4 and E6.
features:
- id: F9.1
  title: Realm as code and real Keycloak in CI
  stories:
  - id: F9.1.S1
    title: Realm export deploy/keycloak/realm-inkcast.json (clients, roles, policies; no secrets)
    status: done
    change: 'built in PR #14'
    acceptance:
    - 'deploy/keycloak/realm-inkcast.json: realm, roles, the inkcast-identity client; no secret or person in Git'
    - Secrets and URLs through ${...} placeholders filled at import; tests/test_keycloak_realm.py keeps it so
  - id: F9.1.S2
    title: 'kind CI: Keycloak with the realm; end-to-end sign-in against it in single and split mode'
    status: done
    change: 'single mode in PR #14; split mode on kind in PR #23 (fixed #17)'
    acceptance:
    - The kind CI job deploys Keycloak with the realm and checks the placeholders were filled
    - A person with inkcast-user signs in through Keycloak's own login page end to end and reaches /api/v1/me
    - A person without the role is refused by Inkcast after Keycloak accepted the password
    - The same driver (scripts/dev/oidc_signin.py) is tested against a Keycloak-shaped fake in single and split mode
    - Split mode against the real Keycloak on kind
  - id: F9.1.S3
    title: Kustomize component for Keycloak (dev) and docs for a production Keycloak on Postgres
    status: in-progress
    change: 'dev Kustomize and production notes in PR #14; a production component waits for ADR-0014''s PostgreSQL'
- id: F9.2
  title: Self sign-up
  stories:
  - id: F9.2.S1
    title: Registration, email verification, terms; default role inkcast-user
    status: done
    change: 'built in PR #19'
    acceptance:
    - A newcomer registers on Keycloak's own page, verifies the emailed link and accepts the terms, then reaches Inkcast's
      /api/v1/me with the default inkcast-user role (kind CI, real Keycloak and Mailpit)
    - A newcomer who never verifies never reaches Inkcast
    - The realm declares every required action it relies on (listing them replaces Keycloak's defaults); SMTP settings are
      placeholders, no SMTP secret in Git
    - The driver is tested against a Keycloak-shaped fake (registration, verification email, terms) in single and split mode
  - id: F9.2.S2
    title: First login creates the Inkcast user and their personal organization (owner tuple; emits org.created)
    status: planned
    change: needs E3's organizations (F3.2) for the personal organization; the Inkcast user is already created at first login
- id: F9.3
  title: Social login and account linking
  stories:
  - id: F9.3.S1
    title: Google, GitHub, Microsoft identity providers (secrets from Kubernetes Secrets)
    status: planned
  - id: F9.3.S2
    title: First-broker-login flow links by verified email; manual verification runbook
    status: planned
    change: 'refined by ADR-0018 section 8 (issue #324)'
    acceptance:
    - 'The realm keeps Keycloak''s default first-broker-login flow: an existing account with the same email is linked
      only after the person confirms and proves it (Verify Existing Account By Email, or By Re-authentication); never
      the AutoLink authenticator'
    - 'duplicateEmailsAllowed stays false, so a disabled account''s email stays reserved until its Keycloak user is
      removed (F9.5.S10) and a social sign-in with it cannot make a second account meanwhile'
    - 'Inkcast keys on the Keycloak user id (oidc:<issuer>#<sub>) and never links or merges accounts by email'
    - 'Measured on kind: a social sign-in whose email matches an enabled account is linked only after verification; one
      whose email matches a disabled account makes no new account'
- id: F9.4
  title: MFA and operators
  stories:
  - id: F9.4.S1
    title: inkcast-admin requires OTP or WebAuthn; admin client enforces it
    status: planned
- id: F9.5
  title: Identity and membership sync
  stories:
  - id: F9.5.S1
    title: IdentitySync consumes Keycloak user and Organization events (membership, admins) and writes tuples (ADR-0008)
    status: planned
    change: refined
  - id: F9.5.S2
    title: 'Disabled or deleted user: revoke OAuth tokens and PATs, delete tuples, refuse sign-in (tested with real Keycloak)'
    status: done
    change: 'built in the user-sync PR (tokens, PATs, codes); tuples are deleted by E3.F3.8 once OpenFGA holds any'
    acceptance:
    - 'IdentityService polls Keycloak as the inkcast-sync service account (view-users, view-events only): USER admin
      events every INKCAST_KEYCLOAK_SYNC_INTERVAL (30 s), and a full reconcile every INKCAST_KEYCLOAK_RECONCILE_INTERVAL
      (10 min) and at start, so a missed event or an account-console deletion is still caught'
    - A person disabled or deleted in Keycloak loses every OAuth token, code and personal access token in one
      transaction; token lookups also refuse anything minted for them in the moment of the cut-off
    - They sign in again once Keycloak allows it; their old tokens stay dead
    - 'Events identity.user.disabled and identity.sync.failed; metrics inkcast_identity_sync_total{result} and
      inkcast_identity_users_disabled_total{reason}; alert InkcastIdentitySyncFailing'
    - 'kind CI: an administrator disables ada with kcadm; her OAuth token and PAT answer 401 within 60 s; re-enabled,
      she signs in again'
  - id: F9.5.S3
    title: Scheduled reconcile of Keycloak membership against OpenFGA; a missed event still removes access; drift alert
    status: planned
    change: new
  - id: F9.5.S4
    title: 'Delete my account: Inkcast leads, Keycloak deletes the account (kc_action=delete_account), Inkcast erases
      the data'
    status: done
    change: 'built in PR #69 (issue #41): Inkcast-led, Keycloak deletes through its delete_account application-initiated
      action (fine-grained admin permissions have no delete-only scope: manage also allows email change and action emails);
      Keycloak 26 never redirects back after a successful deletion, so the client baseUrl links its "deleted" page to
      /account/return, where the visit is matched by a cookie and confirmed through view-users before erasing (via=return);
      the sync reads DELETE_ACCOUNT user events as the backstop (via=event); erase_user from #65'
    acceptance:
    - MCP inkcast_delete_account and REST POST /api/v1/account/deletion-link (OAuth only) return a one-time link
    - 'Inkcast''s page: what goes, what stays (articles on the platforms), the export (E3.F3.3.S7); Continue goes to
      Keycloak with kc_action=delete_account, where the person confirms and Keycloak deletes the account'
    - 'Realm: delete_account required action enabled; account client''s delete-account role in the default roles;
      DELETE_ACCOUNT in enabledEventTypes (the account console''s Delete account is an accepted side effect)'
    - 'Erasure (E3.F3.3.S5, one transaction) on the visit back from Keycloak''s "deleted" page (matched by a cookie to the
      pending record, confirmed through the sync''s read-only view-users), and as a backstop from the sync reading
      DELETE_ACCOUNT user events; cancelled or an error erases nothing; audit keeps a salted id hash, time and counts'
    - 'Event identity.user.deleted; inkcast_identity_users_deleted_total{via=return|event}; the sync keeps view-users
      and view-events only'
    - 'Kind e2e: ada deletes through the flow (401 on her tokens, Keycloak user and Inkcast rows gone, others untouched);
      an account-console deletion is erased through the event path within 60 s; the walkthrough gains the steps'
  - id: F9.5.S5
    title: The user sync proven in split mode on kind (IdentityService's own Deployment carries the sync settings)
    status: planned
    change: 'new; issue #42'
    acceptance:
    - ci-split-oidc sets INKCAST_KEYCLOAK_SYNC_* and the secret on the IdentityService Deployment only
    - keycloak-e2e.sh runs the disable, 401, re-enable check through the Gateway as it does in single mode
  - id: F9.5.S6
    title: 'A person gone from Keycloak with no DELETE_ACCOUNT event (an administrator''s deletion, a trimmed event) is
      erased after INKCAST_KEYCLOAK_ERASE_AFTER_DAYS'
    status: done
    change: 'new; issue #86, built in PR #98; its rule that a disabled-but-present person is never erased is replaced by
      F9.5.S9 (issue #330, ADR-0018): every cut-off person is erased INKCAST_KEYCLOAK_ERASE_AFTER_DAYS after the
      account-cleanup job told them'
    acceptance:
    - 'INKCAST_KEYCLOAK_ERASE_AFTER_DAYS, default 30: N > 0 erases a person still gone N days after the cut-off (exactly
      N counts); 0 erases at the first reconcile that finds them gone; off never erases on a 404 (cut off only)'
    - 'Validated at start-up: anything but a whole number >= 0 or off is a configuration error naming the variable; off
      in production or staging is a posture warning (keycloak-erase-after)'
    - 'The reconcile re-checks cut-off people too; users.deleted_at (added through COLUMNS) records when a person was
      first found gone, and is cleared when Keycloak has them again or at sign-in, so a restore resets the grace period'
    - A disabled-but-present Keycloak user is never erased, in any mode; a found DELETE_ACCOUNT event erases at once
    - 'Each erasure from the reconcile is counted once as inkcast_identity_users_deleted_total{via="reconcile"} and
      audited once in user_erasures'
    - 'Set explicitly (30) in deploy/kustomize/environments/{staging,production} and deploy/dev/compose.yaml; the README
      configuration table, the E9 design and the sync runbook say what an administrator''s deletion means for data'
    - 'tests/test_erase_after_days.py: each mode, the boundary (N days minus a second; exactly N), present-but-disabled
      in every mode, counted and audited once across reconciles, configuration errors, the posture warning, the
      migration, and the fake Keycloak honouring the user filter on events'
  - id: F9.5.S7
    title: 'A mass "user not found" from Keycloak waits for an operator: a circuit breaker on the reconcile, parameterised'
    status: done
    change: 'new; issue #105, built in PR #131'
    acceptance:
    - 'The reconcile reads everyone before acting on anyone and counts the people newly found gone (404, no DELETE_ACCOUNT
      event, no deleted_at yet); at INKCAST_KEYCLOAK_BREAKER_MIN (5) or more and above INKCAST_KEYCLOAK_BREAKER_PERCENT
      (10) of the people read it trips: nobody is cut off or erased, no deleted_at clock starts or advances'
    - 'The pass is recorded (sync_breaker_trips: id, time, counts, status, who resolved it; sync_breaker_people: the ids
      with last_login_at as read, in USER_TABLES), inkcast_identity_sync_breaker_open is 1 (read from the database, so a
      restart changes nothing), InkcastIdentitySyncBreakerOpen (critical) fires with a runbook section'
    - 'It stays open, every pass holding every 404 without an event (the admin-events pass too), until an operator runs
      inkcast identity confirm-deletions --pass <id> (exactly that pass''s people are cut off and marked gone from then;
      one who signed in since is spared; the reconcile erases them as the policy says) or dismiss-deletions (nothing
      done; everyone read again); trips lists the passes; each is claimed once and audited (the pass row and
      identity.sync.breaker.confirmed / dismissed with the pass id and who; never a person''s id)'
    - 'Not held: a self-deletion with its DELETE_ACCOUNT event (events pass or reconcile) and Keycloak''s own
      enabled: false'
    - 'INKCAST_KEYCLOAK_BREAKER=on|off, _PERCENT (1-100) and _MIN (1 or more) validated at load and by validate(), each
      error naming the variable; off neither trips nor holds and is a posture warning (keycloak-breaker) in production
      and staging; set explicitly in deploy/kustomize/environments/{staging,production} and deploy/dev/compose.yaml'
    - 'From the review: keycloak-erase-after says info, not pass, when sign-in is not a Keycloak realm or the sync is
      off; more than ten years warns as effectively off'
    - 'tests/test_sync_breaker.py: below the threshold as today, at and above it in every erase mode, the boundaries and
      settings, open across reconciles and restarts, confirmation applies exactly the pass''s people and audits it, the
      wrong pass or a second confirmation does nothing, dismissal, self-deletions by event still erase while open, each
      setting validated, the posture warnings, the alert'
  - id: F9.5.S8
    title: 'The breaker holds a mass "disabled" too: sign-in is cut at once, personal access tokens are held, not revoked'
    status: done
    change: 'new; issue #135, built in PR #138'
    acceptance:
    - 'A reconcile counts the people newly found disabled (enabled: false, no disabled_at yet) together with the people
      newly found gone, against INKCAST_KEYCLOAK_BREAKER_MIN and _PERCENT; a switched-off importing LDAP provider, which
      Keycloak reports as its people disabled, trips it like a non-importing one does with 404s'
    - 'Above the thresholds the disabled are held (users.held_at through COLUMNS; Store.hold_user): OAuth access and
      refresh tokens, codes and pending consents are cut at once (reversible: a sign-in restores them), personal access
      tokens are refused but not revoked; the REST API answers 401 token_held and says why; _ACTIVE_USER refuses a held
      person''s token, code and PAT as it does a disabled person''s'
    - 'The pass records each person with their kind (sync_breaker_people.kind, sync_breaker_trips.disabled, through
      COLUMNS; a pass from #131 reads as a 404 pass); the gauge, InkcastIdentitySyncBreakerOpen and the audit are the
      404 trip''s, with the disabled counts; identity.user.held and identity.user.released per person, ids and counts only'
    - 'Confirming a pass cuts its people off by kind (the gone as before; the disabled lose their PATs and are never
      erased); dismissing does nothing to the gone and releases the disabled, whose PATs work again; trips lists both
      counts; the audit lines carry the counts by kind'
    - 'A held person Keycloak reports enabled again is released by whichever pass reads them and leaves the pass, so
      confirming spares them; a sign-in lifts the hold; one who signs in between the reconcile''s read and its hold is not
      held'
    - 'While a pass is held the admin-events pass holds a disabled person too (not added to the pass; the first reconcile
      after the pass is resolved judges them afresh); below the thresholds, and with INKCAST_KEYCLOAK_BREAKER=off, a
      disabled person is cut off at once as before (off cuts a pending pass''s held people off at the next reconcile)'
    - 'tests/test_sync_breaker_disabled.py: twenty newly disabled held in every erase mode, the boundaries, not newly when
      cut off earlier, confirm and dismiss by kind, trips, one person as today, the events pass closed and open, a mixed
      trip, re-enabled before confirmation (reconcile, events pass, sign-in, mid-reconcile sign-in), breaker off, the
      store, the migration, the alert and posture texts'
  - id: F9.5.S9
    title: 'The account-cleanup job: a cut-off person is told, reminded and erased INKCAST_KEYCLOAK_ERASE_AFTER_DAYS
      after the notice (replaces F9.5.S6''s rule)'
    status: planned
    change: 'new; issue #330; ADR-0018 sections 1 to 5; needs F7.4.S4, F3.3.S8 and F3.3.S9'
    acceptance:
    - 'The rule, stated in the README, the E9 design, the alerts runbook and the posture check: every person Inkcast has
      cut off (Keycloak reports them disabled or 404) is erased INKCAST_KEYCLOAK_ERASE_AFTER_DAYS after the job told
      them, unless Keycloak reports them enabled again, they sign in, or they are on legal hold; the reconcile no longer
      erases; a self-deletion still erases at once'
    - 'Settings validated at start-up, naming the variable: INKCAST_KEYCLOAK_ERASE_AFTER_DAYS whole days 14 to 365 (0
      and off refused), INKCAST_ACCOUNT_REMINDER_DAYS 1 to 13 and below it; both set explicitly in
      deploy/kustomize/environments/{staging,production}'
    - 'inkcast accounts cleanup [--dry-run] runs as the CronJob inkcast-account-cleanup (daily, concurrencyPolicy
      Forbid, the backup''s pod affinity while the database is SQLite); one run at a time through a lease in sync_state'
    - 'Each run: nothing while a breaker pass is open; each disabled person read from Keycloak as disabled or 404 is
      sent the notice, then gets users.erase_at and notified_at; the reminder goes INKCAST_ACCOUNT_REMINDER_DAYS before
      (reminded_at); at erase_at they are read again and erased, or unscheduled when Keycloak has them enabled; a failed
      send is retried at the next run; a person with no email address is scheduled and counted'
    - 'A run with at least INKCAST_KEYCLOAK_BREAKER_MIN people due, and more than _PERCENT of the people in Inkcast,
      erases nobody and records a breaker pass of kind erase, resolved by inkcast identity confirm-deletions or
      dismiss-deletions'
    - 'It fails closed: without the sync client, or when Keycloak cannot be read, the run exits 1 and erases nobody;
      every step is a compare-and-set on the row (STANDING gains erase_at)'
    - 'upsert_user also clears erase_at, notified_at and reminded_at; the reconcile does not count a person whose
      erasure is due among the newly gone'
    - 'Audit: user_erasures gains via and notified_at; the events identity.account.scheduled, .reminded and .erased
      carry ids and counts only'
    - 'Gauges read from the database: inkcast_identity_accounts{state}, inkcast_identity_erasure_overdue,
      inkcast_identity_notice_wait_oldest_seconds; alerts InkcastAccountCleanupMissing (no success for 26 h, from
      kube_cronjob_status_last_successful_time), InkcastAccountErasureOverdue and InkcastAccountNoticeFailing, each with
      a runbook section'
    - 'Roll-out: everyone already cut off is notified at the first run and gets the full window; the terms shown at
      sign-up state the period'
    - 'Tests: each state and transition, the boundaries (a second before erase_at, and at it), re-enabled before
      erasure, a sign-in during a run, a failed send, the mass guard, a breaker pass open, Keycloak down, two runs at
      once, the migration; kind e2e: an administrator disables a person, Mailpit receives the notice and its link
      downloads the bundle, and with erase_at moved into the past in the database the next run erases them'
  - id: F9.5.S10
    title: 'Remove the Keycloak user at erasure: a separate cleanup client; local users always, federated users only
      once out of the directory group'
    status: planned
    change: 'new; issue #331; ADR-0018 section 9; owner decisions 1 to 3 first; needs F9.5.S9 and F9.8.S3''s
      measurements'
    acceptance:
    - 'Measured on OpenShift Local before building, and recorded in the E9 design: GET
      /admin/realms/{realm}/users/{id}/groups for a person who left the group, one deleted in LDAP, a member an
      administrator disabled, and with LDAP scaled to 0'
    - 'Realm: a confidential client inkcast-cleanup whose service account holds realm-management view-users and
      manage-users only; its secret (INKCAST_KEYCLOAK_CLEANUP_SECRET) is mounted into the CronJob only; the sync client
      keeps view-users and view-events'
    - 'The job deletes by id, just before Inkcast''s erasure, only a person it has just read as enabled false: a local
      person always; a federated person only when Keycloak no longer lists them in the environment''s directory group
      (if the measurement refutes that, never, and inkcast_identity_keycloak_copies_kept counts them for an operator,
      with a runbook section)'
    - 'The sync''s admin-events pass alerts on any admin event made by inkcast-cleanup other than a user DELETE'
    - 'Without the client configured, the job erases Inkcast''s data only, counts the Keycloak copies left, and the
      posture check warns in production and staging'
    - 'Tests against the Keycloak-shaped fake and on kind: a disabled local person is gone from Keycloak and Inkcast
      after erasure and their email is free; on OpenShift Local: a federated member an administrator disabled is kept'
  - id: F9.5.S11
    title: 'A cut-off person''s scheduled posts are paused; nothing paused goes out on their return without them'
    status: planned
    change: 'new; issue #332; ADR-0018 owner decision 4'
    acceptance:
    - 'The scheduler does not claim a post whose person has disabled_at set (posts.py _OWNED); a person the breaker
      holds (held_at) keeps publishing'
    - 'What a paused post becomes when its person returns is decided within ADR-0015''s rules and recorded; nothing
      paused is sent on their return without their action'
    - 'The account notice says that scheduled posts are paused'
    - 'Tests: a due post of a cut-off person is not claimed, a held person''s is, the return, and the lag gauges leave
      paused posts out'

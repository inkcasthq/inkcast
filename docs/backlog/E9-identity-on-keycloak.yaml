- id: F9.7
  title: Operations
  stories:
  - id: F9.7.S1
    title: 'Runbook: realm upgrades, signing-key rotation, backup and restore'
    status: planned
  - id: F9.7.S2
    title: 'Keycloak event retention in the realm: eventsExpiration and adminEventsExpiration (7 days)'
    status: done
    change: 'new; issue #43, built in the event-retention PR (adminEventsExpiration is a realm attribute in Keycloak 26)'
    acceptance:

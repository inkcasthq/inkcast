    acceptance:
    - 'The CodeQL check on pull requests no longer warns "1 configuration not found" (needs the owner in Security, Tool
      status, or a token with security_events)'
    - docs/cicd.md says how to retire a configuration when a workflow or job is renamed
  - id: F1.8.S6
    title: 'Repository security settings as code: secret scanning with push protection, Dependabot security updates,
      private vulnerability reporting'
    status: in-progress
    change: 'new; issue #45, found 2026-10-19 (all off on a public repository); as code in PR #46, live once the owner
      runs scripts/repo/settings.py apply'
    acceptance:
    - Secret scanning, push protection (with non-provider patterns), Dependabot security updates, vulnerability alerts and
      private vulnerability reporting are on
    - Kept as code in .github/repo-settings.json; scripts/repo/settings.py apply sets them and check compares them

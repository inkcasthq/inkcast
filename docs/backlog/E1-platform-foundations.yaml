- id: F1.10
  title: Business rules as settings
  stories:
  - id: F1.10.S1
    title: Publish retry policy as settings (attempts and delays)
    status: done
    change: 'new; issue #89, built in PR #124'
    acceptance:
    - 'INKCAST_PUBLISH_MAX_ATTEMPTS (default 4, 1-10) and INKCAST_PUBLISH_RETRY_DELAYS (default 60,300,1800; 1-9 values,
      each 30-21600 s, never decreasing); the defaults equal today''s behaviour'
    - An uncertain error is never retried whatever the settings; a posture warning when the window exceeds 24 h
  - id: F1.10.S2
    title: 'Token lifetimes as settings: personal access tokens and MCP sign-in'
    status: planned
    change: 'new; issue #90'
    acceptance:
    - 'INKCAST_PAT_DEFAULT_DAYS (90), INKCAST_PAT_MAX_DAYS (366, at most 366), INKCAST_PAT_ALLOW_NO_EXPIRY (true),
      INKCAST_REFRESH_TOKEN_DAYS (30, 1-90); default <= maximum checked at load'
    - Every PAT entry point (REST, /tokens/new, MCP) enforces the limit with a 422 naming it; production sets the PAT settings
  - id: F1.10.S3
    title: 'Retention as settings: domain events and hourly KPIs'
    status: planned
    change: 'new; issue #91'
    acceptance:
    - INKCAST_OUTBOX_RETENTION_DAYS (7, 1-30) and INKCAST_KPI_HOURLY_RETENTION_DAYS (90, 31-400); production sets both
    - Hourly KPI retention may not be shorter than the outbox's (kpi_applied stops a replayed event counting twice)
  - id: F1.10.S4
    title: One-time link lifetime as a setting (connect and deletion links)
    status: planned
    change: 'new; issue #92'
    acceptance:
    - INKCAST_ONE_TIME_LINK_MINUTES (15, 5-60, one value for both links); MCP and REST replies state the configured lifetime
  - id: F1.10.S5
    title: 'Validate the existing business settings: intervals, grace, rate limit, backup copies'
    status: planned
    change: 'new; issue #93'
    acceptance:
    - 'Sync, reconcile, scheduler, insights and shutdown intervals refuse <= 0; the scheduler stays 1-60; overdue grace is
      at least twice the scheduler interval; the rate limit refuses < 0 and fails production posture at 0 with password sign-in;
      INKCAST_BACKUP_KEEP is validated cleanly'
    - Each refusal names the variable and has a test

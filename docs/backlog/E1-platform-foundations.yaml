    acceptance:
    - 'The CodeQL check on pull requests no longer warns "1 configuration not found" (needs the owner in Security, Tool
      status, or a token with security_events)'
    - docs/cicd.md says how to retire a configuration when a workflow or job is renamed
  - id: F1.8.S6

- id: F1.8
  title: Supply chain and repository hardening
  stories:
  - id: F1.8.S1
    title: 'Protect main with a ruleset: required checks, squash only, no force-push or deletion'
    status: in-progress
    change: 'new; issue #34, as code in PR #46 (approvals 0 while there is one maintainer); live once the owner runs
      scripts/repo/settings.py apply (automation here may not write repository settings)'
    acceptance:
    - 'Required checks: lint, test (3.12), test (3.13), test (3.14), test (3.15), authz, manifests, image, kind, dashboards,
      analyze (CodeQL); a pull request cannot merge while one is missing or failing'
    - Squash merge only, linear history, no force-push or branch deletion on main; bypass for no one (owner included)
    - The ruleset is kept as code (.github/rulesets/main.json) and a check compares it with the live ruleset
    - docs/bootstrap.md lists the required checks from the same file, so renaming a job means editing one place
  - id: F1.8.S2
    title: Base images pinned by digest (python, Keycloak, Mailpit, Prometheus, Grafana) and moved by Dependabot
    status: done
    change: 'new; issue #35, built in PR #50 (digests resolved by CI; Kubernetes manifests are checked weekly by
      scripts/images.py verify, since Dependabot does not read them)'
    acceptance:
    - 'Every FROM and image: line names a tag and its digest (name:tag@sha256:...); the Dockerfile comment that claims
      this becomes true'
    - A test fails on any image reference without a digest in Dockerfile, deploy/ and the workflows
    - Dependabot's docker ecosystem covers each directory that holds image references and opens digest bumps weekly
  - id: F1.8.S3
    title: Hash-locked Python dependencies for the image (requirements.lock, pip install --require-hashes)
    status: done
    change: 'new; issue #36. PR #53: scripts/lock.sh and the lock-refresh workflow (locks resolved in CI, where PyPI
      is reachable); then the image installs from the locks with --require-hashes, and the locks job checks them'
    acceptance:
    - requirements.lock pins every runtime dependency, transitive ones included, with sha256 hashes for each wheel
    - The image installs with --require-hashes --no-deps from the lock, then the wheel with --no-deps; two builds of one
      commit install identical files
    - A CI check fails when the lock no longer satisfies pyproject.toml; scripts/lock.sh regenerates it
    - Dependabot (pip) keeps the lock fresh; the SBOM job lists exactly the locked versions
  - id: F1.8.S4
    title: kind's node image pinned by digest in CI and scripts/dev/stack.sh
    status: done
    change: 'new; issue #37, built in PR #55 (kind v0.33.0, kindest/node v1.37.0 by digest, kubectl v1.37.0; both
      binaries SHA-256 checked by scripts/kind-tools.sh)'
    acceptance:
    - kind create cluster --image kindest/node:<version>@sha256:<digest> everywhere it runs, with the kind version pinned
      next to it
    - One place holds the pin (scripts/versions.env); a test checks every kind create uses it
  - id: F1.8.S5
    title: Remove the stale publish.yml:codeql code-scanning configuration
    status: in-progress
    change: 'new; issue #38; docs/cicd.md says how (UI or API with security_events); the deletion itself is the

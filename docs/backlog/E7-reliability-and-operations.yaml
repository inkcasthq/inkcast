  - id: F7.6.S5
    title: 'Runbook: the Compose stack on an EC2 instance (localhost-bound ports reached over SSM or SSH port forwarding,
      secrets from AWS Secrets Manager)'
    status: planned
    issue: 39
    change: 'new; issue #39'
    acceptance:
    - docs/runbooks/compose-on-ec2.md takes a fresh Amazon Linux or Ubuntu instance to a running stack (Docker, Compose,
      the repo, scripts/dev/stack.sh compose)
    - No inbound security-group rule is needed; access is by SSM Session Manager port forwarding (or SSH -L) to 8787, 3000
      and 9091
    - Secrets come from AWS Secrets Manager through the instance role into the files Compose mounts, as in the secrets
      design (docs/reference/secrets.md); nothing secret on the command line or in shell history
    - Stop, start and teardown steps; what survives a stop (volumes) and what does not
- id: F7.7
  title: Dashboards to the /dashboard standard
  stories:
  - id: F7.7.S1
    title: Platform health Grafana dashboard generated from libs/dashboards.py; sidecar ConfigMap component
    status: done
    change: 'new; built in PR #8'
  - id: F7.7.S2

      by reason, inkcast_authz_checks_total by result and the check latency (after E3.F3.6)'
    - 'Panels for features that are off show "No data" in the neutral colour, never green, and the check lists them in
      EXPECTED_EMPTY with the reason'
    - The kind dashboards check seeds them (a sync pass against the realm, allowed and denied checks) and every panel's
      query runs through Grafana

# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E7
title: Reliability, observability and operations
status: planned
goal: Alerts and SLOs as code, channel health, contract tests, notifications, dashboards, traces, backups and DR, edge protection,
  cost, and the metrics and KPI foundations (four layers).
features:
- id: F7.1
  title: Alert catalogue
  stories:
  - id: F7.1.S1
    title: 'catalogue → PrometheusRule and runbooks: 13 symptom alerts (overdue, stalled, unconfirmed, failure rate, 5xx,
      gateway, outbox lag, cache, rate limits, restarts, volume), generator with --check, test-linked runbooks'
    status: done
    change: 'refined; built in PR #8'
  - id: F7.1.S2
    title: 'Alerts: Keycloak/OpenFGA drift from the reconcilers (F3.8.S3, F9.5.S3)'
    status: planned
    change: 'new; refined 2026-10-28 (review): the authz error alert exists (InkcastAuthzErrors, F3.6.S5); the billing
      alerts are F7.1.S7 and licence expiry is in F5.8.S4, since W12 comes before E5'
  - id: F7.1.S3
    title: 'ServiceMonitor relabelings: inkcast.io/service → service label; monitoring ingress by namespace AND pod selector'
    status: planned
    change: new
  - id: F7.1.S4
    title: 'Log-based alerts from the EVENTS catalogue (Loki ruler): config.unsafe, secrets.fetch.failed, auth.login.refused
      bursts; generated like the PrometheusRule'
    status: planned
    change: new
  - id: F7.1.S5
    title: promtool check rules + promtool test rules (one unit test per alert) in CI
    status: planned
    change: new
  - id: F7.1.S6
    title: Alertmanager routing example (severity → pager/channel, inhibit scheduler-stalled over overdue) in the openshift
      overlay as an AlertmanagerConfig; receivers for email, Slack, Microsoft Teams (msteamsv2, Workflows) and
      Telegram, each credential from a Secret
    status: planned
    change: new
    acceptance:
    - 'Each credential is a SecretKeySelector of the AlertmanagerConfig: slackConfigs apiURL, msteamsv2Configs webhookURL,
      telegramConfigs botToken, emailConfigs authPassword'
    - 'msteamsv2Configs needs Alertmanager 0.28.0 or later (prometheus-operator''s AlertmanagerConfig types); the PR
      records the version the cluster''s user-workload Alertmanager runs'
  - id: F7.1.S7
    title: 'Alerts: billing webhook rejections, billing reconcile drift (F5.4.S3) and seat-sync failures (F5.3.S5)'
    status: planned
    change: 'new 2026-10-28 (review): split from F7.1.S2'

# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E7
title: Reliability, observability and operations
status: planned
goal: Alerts and SLOs as code, channel health, contract tests, notifications, dashboards, traces, backups and DR, edge protection,
  cost, and the metrics and KPI foundations (four layers).
features:
- id: F7.1
  title: Alert catalogue
  stories:
  - id: F7.1.S1

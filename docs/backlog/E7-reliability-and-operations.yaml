      gateway, outbox lag, cache, rate limits, restarts, volume), generator with --check, test-linked runbooks'
    status: done
    change: 'refined; built in PR #8'
  - id: F7.1.S2
    title: 'Alerts: authz error rate, Keycloak/OpenFGA drift, billing webhook rejections and reconcile drift, licence expiring,
      seat-sync failures'
    status: planned
    change: new
  - id: F7.1.S3
    title: 'ServiceMonitor relabelings: inkcast.io/service → service label; monitoring ingress by namespace AND pod selector'
    status: planned
    change: new
  - id: F7.1.S4
    title: 'Log-based alerts from the EVENTS catalogue (Loki ruler): config.unsafe, secrets.fetch.failed, auth.login.refused
      bursts; generated like the PrometheusRule'
    status: planned
    change: new
  - id: F7.1.S5

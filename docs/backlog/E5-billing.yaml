# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E5
title: Billing, entitlements and metering
status: planned
goal: Plans as code, per-organization entitlements enforced at every use case after OpenFGA, a pluggable billing provider,
  offline licences (ADR-0010 to ADR-0013; design in docs/epics/E10-tiers-and-billing/design.md).
features:
- id: F5.1
  phase: 4
  title: BillingProvider seam, fake adapter and SubscriptionService
  stories:
  - id: F5.1.S1
    change: refined
    status: planned
    title: 'BillingProvider protocol: checkout_session, portal_session, verify_webhook, parse_event (+ get_subscription, update_quantity,
      change_plan, cancel, list_events_since)'
    acceptance:
    - Normalized BillingEvent types; no SDK types leave the adapter
    - A contract test suite every adapter must pass
  - id: F5.1.S2
    change: new
    status: planned
    title: 'FakeBillingProvider: local hosted-checkout page and HMAC-signed webhooks (tests/fakes.py)'
    acceptance:
    - Upgrade end to end in CI with no network, single and split mode
    - Refused in production by a posture check
  - id: F5.1.S3
    change: new
    status: planned
    title: SubscriptionService ServiceSpec; routes /api/v1/plans, /api/v1/billing, /webhooks/billing/; needs=billing
    acceptance:
    - gen-manifests --check and architecture tests pass
    - Listed by `inkcast services`; runs in All and split
  - id: F5.1.S4
    change: new
    status: planned
    title: ManualBillingProvider for invoiced Enterprise subscriptions
    acceptance:
    - An operator-created subscription produces a snapshot; audited
- id: F5.2
  phase: 4
  title: Plan catalogue as code
  stories:
  - id: F5.2.S1
    change: refined
    status: planned
    title: 'plans.yaml: feature registry, versioned plans (Free, Personal, Team, Business, Enterprise, Community), prices,
      add-ons, meters'
    acceptance:
    - Invalid catalogue exits 78
    - Enum and registry parity test
    - Never-paywalled test
  - id: F5.2.S2
    change: new
    status: planned
    title: Provider price ids per environment and a drift-check script
    acceptance:
    - Every public price has an id per environment
    - check-catalogue fails on amount or interval drift
  - id: F5.2.S3
    change: new
    status: planned
    title: Public GET /api/v1/plans (cacheable, rate-limited)
    acceptance:
    - No internal fields; ETag
  - id: F5.2.S4
    change: new
    status: planned
    title: Immutable plan versions; subscriptions pin plan_version (grandfathering)
    acceptance:
    - A test fails if a published version changes
    - Cohort migration tool with notice dates
- id: F5.3
  phase: 4
  title: Metering and entitlements
  stories:
  - id: F5.3.S1
    change: refined
    status: planned
    title: Atomic reserve/release counters and idempotent usage events in the owning service's schema
    acceptance:
    - Concurrency test never exceeds the limit (SQLite, Postgres)
    - Same key counts once; cancel compensates
  - id: F5.3.S2
    change: refined
    status: planned
    title: 'libs/entitlements client: snapshot cache, last-known-good, fail-safe classes, 402 problem with upgrade_url and
      can_upgrade'
    acceptance:
    - Class table tested
    - No plan data in JWTs or tuples
  - id: F5.3.S3
    change: new
    status: planned
    title: Snapshots (plan + add-ons + overrides) with monotonic version and entitlements.changed; operator override API for
      E6.F6.4.S2
    acceptance:
    - Deterministic recompute
    - Caches evicted within 5 s
    - Overrides need a reason and an expiry
  - id: F5.3.S4
    change: new
    status: planned
    title: 'Enforce at the edge of each use case after authz.require: channels, stories, queue, repos, PATs, workspaces'
    acceptance:
    - Generated plan × use-case matrix over REST and MCP
    - FGA deny gives 403 before 402; FGA error gives 503 with no reservation
  - id: F5.3.S5
    change: new
    status: planned
    title: Seat ledger checked before billable grants (via the E3 grant API, F3.2.S6) and provider quantity sync
    acceptance:
    - Increases prorated now, decreases at renewal, debounced
    - Reconcile against OpenFGA reports injected drift
  - id: F5.3.S6
    phase: 5
    change: new
    status: planned
    title: 'Credits wallet: AI assists and paid-platform sends (X weights) reserved before send; cost shown in dry run (issue
      21)'
    acceptance:
    - Packs expire oldest first
    - Bring-your-own platform app bypasses credits
  - id: F5.3.S7
    change: new
    status: planned
    title: Plan-based API rate limits per organization and token
    acceptance:
    - 429 with Retry-After; daily figure approximate within 1%
- id: F5.4
  phase: 4
  title: Webhooks
  stories:

# Execution order of the backlog: the waves are worked top to bottom, the items in each wave in the order listed.
# Each wave sits in one delivery phase (docs/epics/README.md, "Delivery phases"): 1 to 5 in order, or ongoing beside
# them. A story's phase (its own, or its feature's) is its wave's phase, or ongoing.
# An item is a story id from docs/backlog/E*.yaml, or '#N' for an open GitHub issue that is not a backlog story.
# Every story that is not done must appear exactly once. scripts/backlog/tracker.py checks this and generates
# docs/backlog/TRACKER.md from it; edit this file, never the tracker.

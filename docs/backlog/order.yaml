# Titles of the '#N' items, so the tracker reads without a network call. --drift checks them against GitHub.
issues:
  59: "DEV destinations: list the organizations this person has already published to (DEV's API can't list a user's organizations)"
  72: "Authz hardening from the adversarial review (PR #70): smaller concerns"
  112: "Erasure: copies outside the backup rotation keep erased data indefinitely"
  128: "restore: 'Nothing was replaced' can be false when the restore is stopped (PID 1 ignores SIGTERM)"
  130: "Publishing: a bad value in a platform block, or a lone surrogate in a field, still answers 500"
  136: "Token lifetimes: follow-ups from the review of #132"
  139: "Keycloak sync breaker: a scripted mass delete or disable through the admin API is acted on one person at a time"
  141: "Outbox housekeeping: retired consumers block purging forever, and housekeeping can starve"
  149: "Account-deletion links are written in clear to the access log"
  159: "Test-order dependence: NoBearerLinksInLogs fails when run after the breaker tests"
  161: "Erasure and cut-off races: the remaining shapes after #102"
  202: "Restore: two restores stamped in the same second leave a full copy on the data volume"
  207: "Alerts: InkcastIdentitySyncReconcileEndingEarly can't fire near the top of the reconcile interval"
  212: "Erasure: workspace member KPIs keep the person's id in dims.member"
  214: "Publishing: writes after a send don't check the claim, and an empty 2xx is published with no URL"
  215: "Rate limits: wording and docs left from #188"
  219: "Owner guards: rollbacks drop newer guards, and the orphan sweep can stop early"
  222: "Always-schedule follow-ups: large imports can page, clock skew in the lag measure, stale wording"
  227: "tokensave fork: workspaces, agent and model discovery, and a local token dashboard"
  234: "Person decides: follow-ups from the review of #231"
  246: "tokensave fork S1: record effort, model, thinking and subagent runs per turn"
  265: "tokensave fork S3b: dashboard page from the mockup"
  268: "Repair tokensave Claude turns stored before the first-line fix"
  269: "tokensave fork S2: workspaces, repo discovery and init --workspace"
  270: "tokensave fork S3c: start the dashboard at login (launchd)"
  271: "tokensave fork S6: propose S1–S3 to tokensave upstream"
  272: "Fix tokensave global.db writers waiting on dashboard reads"
  273: "Fix the tokensave saving rate under tool, model and effort filters"
  280: "Git sync: a replacement remade after a failed run loses the replaced post's created_at"
  290: "Git sync: a re-run within 24 h replays the first skipped result"
  291: "inkcast sync --removed-since: glob_pattern matches more than glob.glob"
  299: "OpenFGA to PostgreSQL with cert-manager client certificates instead of passwords"
  312: "Runbooks: name the namespace instead of hard-coding inkcast"
  324: "Research and design: disabled accounts get export, notice and deletion after N days (cleanup job)"

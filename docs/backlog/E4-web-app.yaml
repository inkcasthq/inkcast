- id: F4.2
  title: BFF session
  stories:
  - id: F4.2.S1
    title: 'WebApp service: OIDC with Keycloak, HttpOnly SameSite session'
    status: planned
    issue: 349
    change: 'issue #349; refined 2026-10-28: Inkcast has no web entry today; the service is named inkcast-web, on its
      own host, with its own Keycloak client (owner''s decision)'
    acceptance:
    - 'Today GET / on the API host answers 404 and sign-in starts only from an OAuth or MCP client (/register, then
      /authorize). After this story a writer opens INKCAST_WEB_URL in a browser, signs in or signs up through Keycloak,
      and lands in the app signed in'
    - 'The service is named inkcast-web: its container image, Deployment, Service and Route all carry that name'
    - 'It has its own public URL, INKCAST_WEB_URL, separate from the API''s INKCAST_PUBLIC_URL: the session cookie is
      never sent to the API host, and the API''s root paths (/authorize, /token, /register, /revoke, /auth/, /tokens/,
      /mcp, /api, /.well-known/*) need no carve-out'
    - 'It signs in through its own confidential client inkcast-web in deploy/keycloak/realm-inkcast.json, with PKCE S256
      and redirect, web origin and post-logout URIs on ${INKCAST_WEB_URL} only; scripts/gen-realm-imports.py substitutes
      that URL per environment, as it does ${INKCAST_PUBLIC_URL}'
    - 'The client secret is a placeholder fed from a new key web-client-secret of Secret keycloak/inkcast-<side>-realm,
      paired by env-secrets with the WebApp''s own copy, like the identity and sync clients; it is never in Git or a log'
    - 'The session cookie is HttpOnly, Secure and SameSite=Lax; the browser never holds a bearer token (ADR-0004)'
  - id: F4.2.S2
    title: Generated API client
    status: planned
  - id: F4.2.S3
    title: 'inkcast-web on OpenShift: in each environment''s namespace, its own host, promoted by digest'
    status: planned
    issue: 350
    change: 'issue #350; new 2026-10-28; the owner chose each environment''s namespace over a shared client namespace'
    acceptance:
    - 'inkcast-web runs in the namespace of its environment (inkcast-staging, inkcast-prod), never in a namespace shared
      by both, so each environment keeps its own realm, Secrets and host'
    - 'Hosts follow the environments'' naming (inkcast-<name>-<side>): https://inkcast-web-staging.apps-crc.testing and
      https://inkcast-web-prod.apps-crc.testing on OpenShift Local. One label, not web.inkcast-<side>: the router''s
      wildcard certificate *.apps-crc.testing covers one label only'
    - 'Its image is built by CI, pushed to the registry and deployed by digest; promote.yml promotes it with Inkcast''s,
      so one promotion PR moves both'
    - 'On OpenShift Local, inkcast-web is ready, its Route is admitted, and its sign-in entry answers 200 through the
      cluster''s own CA (no curl -k)'
    - 'A Playwright journey signs a new writer up and in through https://inkcast-web-staging.apps-crc.testing and reaches
      the app signed in, with screenshots kept as artifacts'

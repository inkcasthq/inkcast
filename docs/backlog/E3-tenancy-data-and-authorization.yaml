# Backlog as code. File with: scripts/backlog/file.py inkcasthq/inkcast (see docs/epics/README.md)
id: E3
title: Tenancy, data and authorization (OpenFGA)
status: planned
goal: 'PostgreSQL, organizations and workspaces, and authorization on OpenFGA from day 1 (docs/authorization.md, ADR-0007):
  deny by default, one enforcement path for web, mobile, REST, MCP and jobs; business state stays in the DB.'
features:
- id: F3.0
  title: 'Spike: OpenFGA in production'
  stories:
  - id: F3.0.S1
    title: Check latency, p99 and ListObjects limits at 100k tuples on Postgres; consistency modes
    status: planned
    change: new
    acceptance:
    - Numbers and the chosen modes recorded in ADR-0007
  - id: F3.0.S2
    title: 'Keycloak to OpenFGA sync: event-listener SPI vs polling admin events, air-gapped image builds'
    status: planned
    change: new
    acceptance:
    - ADR-0008 accepted or amended
- id: F3.1
  title: PostgreSQL repositories
  stories:
  - id: F3.1.S1
    title: Postgres implementation of each repository (schema per service); the OpenFGA store uses the same operator in its
      own database
    status: planned
    change: refined
  - id: F3.1.S2
    title: Versioned, reversible migrations
    status: planned
  - id: F3.1.S3
    title: Posts queue with FOR UPDATE SKIP LOCKED
    status: planned
  - id: F3.1.S4
    title: CI runs the suite on SQLite and Postgres
    status: planned
  - id: F3.1.S5
    title: 'Backups: CloudNativePG scheduled base backups + WAL archiving to object storage; PITR; restore drill in CI (restore
      into a new Cluster, run the e2e suite). Decision: ADR-0014'
    status: planned
    change: new
    acceptance:
    - RPO 5 min, RTO 30 min documented and drilled
    - the drill job is in ci.yml
  - id: F3.1.S6
    title: Queue gauges from the scheduler's memory, not a COUNT per scrape per replica
    status: planned
    change: new
  - id: F3.1.S7
    title: Full-text search on posts and ledger (tsvector); no external search engine
    status: planned
    change: new
  - id: F3.1.S8
    title: Outbox and kpi_rollups as PostgreSQL tables in the owning schemas (BIGSERIAL seq; index-only cursor reads); migrations
    status: planned
    change: new
  - id: F3.1.S9
    title: 'SQLite stopgap until F3.1.S5: inkcast backup/restore/backups, the backup component (daily CronJob, own volume,
      deny-all network), InkcastBackupMissing, restore runbook, restore drill in CI on kind'
    status: in-progress
    change: new; closes the gap review's P0 (no backups) until PostgreSQL
    acceptance:
    - A backup taken while the server writes is consistent (WAL included), passes PRAGMA integrity_check, and has a manifest
      with SHA-256 and row counts
    - Retention removes the oldest only after a good backup; a failed backup removes nothing
    - A restore verifies first, refuses under a live server, and keeps the replaced database
    - The kind CI job backs up, deletes a row, restores and finds the row again
    - No successful backup for 26 h raises InkcastBackupMissing (critical) with a runbook
- id: F3.2
  title: Organizations and workspaces
  stories:
  - id: F3.2.S1
    title: Organization and workspace tables hold business state only; organization id = Keycloak Organization id; every account
      has a personal organization; kind (personal, team, client) and billing_parent for managed client orgs
    status: planned
    change: refined
    acceptance:
    - No role or permission columns
    - Personal organization created at first login (E9.F9.2.S2)
    - 'kind is structural (personal, team, client) and changes only through F3.2.S8; the type people see is derived from
      facts (F3.2.S11)'
    - 'Data belongs to the organization, not the person: a member who leaves keeps nothing of the organization''s, and
      the organization keeps their posts'
  - id: F3.2.S2
    title: 'Roles are OpenFGA relations: org owner, admin, member, billing_admin; workspace manager, editor, reviewer, publisher,
      viewer, client_reviewer'
    status: planned
    change: replaces old F3.2.S1 (members with role columns)
    acceptance:
    - authz/model.fga is the single definition
    - UI and API show roles derived from relations
  - id: F3.2.S3
    title: Membership changes require can_manage_members (model rule)
    status: planned
    change: replaces old F3.2.S2 (grant only roles at or below your own)
    acceptance:
    - 'Model test: editors and reviewers cannot manage members'
  - id: F3.2.S4
    title: Invites as rows (token, role, expiry, accepted_at); accepting writes the tuple through the outbox
    status: planned
    change: 'refined; refined 2026-10-28 (owner ask: join an existing organization by invitation)'
    acceptance:
    - 'An owner or admin invites an email address with a preset role; the link expires (a setting, 7 days by default)
      and can be revoked; only its hash is stored'
    - 'Only a signed-in person whose verified email equals the invited address can accept; a person who already has an
      account gains a second membership, and accounts are never linked or merged by email (ADR-0018 section 8)'
    - 'Invitations are Inkcast rows, not Keycloak''s organization invitation API: CVE-2026-16072 (Red Hat Bugzilla
      2501721, reported 2026-07-17, no fixed version named) lets an invite link listed by that API create a member
      without email verification; the runbook records the pinned Keycloak version''s state'
  - id: F3.2.S5
    title: Ledger and tokens keyed by workspace (migration from user)
    status: planned
    change: refined
  - id: F3.2.S6
    title: Grant API writes seat_assignments and agency_grants in the same transaction and calls entitlements before billable
      or agency tuples (E5.F5.3.S5, F5.9)
    status: planned
    change: new
  - id: F3.2.S7
    title: 'A person belongs to many organizations: list them, switch the active one, leave one; the last owner cannot
      leave'
    status: planned
    change: 'new 2026-10-28 (owner ask: personal and company organizations, joined both ways)'
    acceptance:
    - 'GET /api/v1/me/organizations lists each membership with its role and type; the web session, the CLI and the MCP
      tools act in one active organization and workspace, named on every call or chosen in the session'
    - 'Leaving removes the membership tuples through the outbox; the organization keeps the person''s posts; the last
      owner is refused with a named error until another owner exists'
  - id: F3.2.S8
    title: 'Turn a personal organization into a team organization in place: a rename and a kind change, nothing moved'
    status: planned
    change: 'new 2026-10-28 (owner ask; Vercel turned personal accounts into free teams in January 2024 so a plan change
      moves nothing, while GitHub''s user-to-organization conversion cannot be undone and loses sign-in and tokens)'
    acceptance:
    - 'Inviting a person into a personal organization offers this conversion first; the owner names the team or company'
    - 'Ids, workspaces, channels, posts, tokens and the Keycloak Organization stay; only kind and name change, audited'
    - 'The owner gets a new personal organization at their next sign-in, so they always have one'
    - 'A team organization with one member can turn back into a personal one, if the owner has no other personal
      organization'
  - id: F3.2.S9
    title: 'Move a workspace between organizations, both ways, by a person who is an owner of both'
    status: planned
    change: 'new 2026-10-28 (owner ask: personal to company and back)'
    acceptance:
    - 'Channels, posts, schedules, the ledger and the workspace''s tokens move with it; its tuples are rewritten through
      the outbox in one transaction with the move'
    - 'Members of the workspace who are not members of the target organization are listed before the move, and lose
      access after it; scheduled posts keep their times'
    - 'Audited in both organizations; entitlements of the target are checked once E5 enforces them (F5.3.S4)'
  - id: F3.2.S10
    title: 'Verified domains: an organization proves a domain by a DNS TXT record, and people who sign up with it can join
      by suggestion (default), automatic invitation or manual invitation only'
    status: planned
    change: 'new 2026-10-28 (owner ask; the modes Clerk documents; Slack, Linear and Atlassian claim domains the same
      way). Default mode suggestion until the owner decides otherwise (#360)'
    acceptance:
    - 'An owner adds a domain and gets a TXT value; Inkcast resolves it and marks the domain verified; the domain is
      written to the Keycloak Organization''s domains, which Keycloak keeps unique per realm'
    - 'Domains of free mail providers (a versioned list in the repository: gmail.com, outlook.com, yahoo.com,
      icloud.com and others) and a domain verified by another organization are refused'
    - 'Each domain has one mode and a default role: suggestion (the person asks, an admin approves), automatic
      invitation (a pending invitation the person accepts) or manual (nothing offered)'
    - 'The TXT record is checked again daily; after 14 days without it the domain is unverified, its mode stops, and the
      owners are told; existing members stay'
    - 'At sign-up, a person whose email is on a verified domain sees that organization''s offer; one on another company
      domain is asked whether to create an organization for it and verify the domain'
  - id: F3.2.S11
    title: 'Organization type and system tags derived from facts: personal, team, company (a verified domain), enterprise
      (SSO connected), client (agency-managed); people''s own labels kept apart'
    status: planned
    change: 'new 2026-10-28 (owner ask: a tag added automatically to classify each organization)'
    acceptance:
    - 'The type and the system tags (plan, seat band, SSO on) are computed from stored facts and recomputed on the events
      that change them; nobody can set them by hand'
    - 'Owners may add free labels, stored apart and never read by authorization, billing or the type'
    - 'No outside enrichment service is called (personal data would leave, and air-gapped installs could not reach it)'
    - 'The type is in GET /api/v1/me/organizations, in the admin portal (E6) and in the signups-by-type KPI (F6.5.S2)'
- id: F3.3
  title: Isolation and audit
  stories:
  - id: F3.3.S1
    title: Row-level security on workspace_id as defence in depth behind OpenFGA
    status: planned
    change: refined
  - id: F3.3.S2
    title: Cross-tenant negative suite at the model-test and API level
    status: planned
    change: refined
  - id: F3.3.S3
    title: Audit log of every state change, grant, revoke and billing action, with actor (web, API, MCP, action)
    status: planned
    change: refined
  - id: F3.3.S4
    title: 'Retention policy as code: posts, ledger, idempotency, tokens last_used, audit per plan; housekeeping job; documented
      in docs/design/observability-and-kpis.md §6'
    status: planned
    change: new
  - id: F3.3.S5
    title: 'Erasure flow (user and organization): owning tables, user-scope KPI rows deleted, member dims tombstoned, outbox
      purged; audited'
    status: done
    issue: 65
    change: 'user half built (issue #65): Store.erase_user over every user-keyed table in one transaction, the user_erasures
      audit (salted id hash, time, counts) and an architecture test that scans the live schema; the organization half
      (member dims tombstoned) is F3.3.S11, split out 2026-10-28 so this story matches its closed issue'
  - id: F3.3.S6
    title: Events carry org_id and workspace_id; rollups appear at those scopes with no consumer change (test)
    status: planned
    change: new
  - id: F3.3.S7
    title: 'Export my data: one JSON bundle of everything Inkcast holds about the person (never credentials or tokens)'
    status: planned
    issue: 61
    change: 'new; issue #61 (offered first by the account-deletion page, E9.F9.5.S4)'
    acceptance:
    - MCP inkcast_export and REST POST /api/v1/account/export give a one-time download link (OAuth only, 24 h, once)
    - 'Schema-versioned JSON: profile, posts with markdown and per-platform results, schedules, ledger, connected platforms
      (names and accounts only), token names, scopes and dates, KPI rollups'
    - Tests prove no secret is in the bundle and another account's data never appears
  - id: F3.3.S8
    title: 'Export for a cut-off person: an emailed link (7 days, 5 downloads, never past the erasure)'
    status: planned
    issue: 328
    change: 'new; issue #328; ADR-0018 section 6, builds on F3.3.S7 (#61) and F7.4.S4'
    acceptance:
    - 'Each account notice carries a link to /account/export/<token>: a 256-bit random token stored only as its hash
      (table export_links, in USER_TABLES), valid INKCAST_EXPORT_LINK_DAYS (default 7; 1 to 14, validated at start-up
      naming the variable; set explicitly in staging and production) and never past users.erase_at, for at most 5
      downloads'
    - 'GET shows a page; the bundle (F3.3.S7''s schema, never credentials or tokens) downloads only by a POST from that
      page, so a mail scanner that opens links uses up nothing; an unknown, used-up or expired token gets the same
      neutral page'
    - 'An expired link offers to send a new one to the address on file, at most once a day per person; the address
      cannot be changed there'
    - 'users.email_since records when the current address arrived (at creation, and when a sign-in changes it); an
      address that changed within the 7 days before the cut-off gets the notice without a link, and the notice says to
      contact support'
    - 'inkcast accounts export off|on --user <id> --by <who> stops or restores the links for one person, audited; each
      download is an identity.account.exported event (ids only)'
    - 'Tests: another person''s data never appears, expiry at the boundary, the download cap, the POST-only download,
      the email-age rule, and erasure removes the links'
  - id: F3.3.S9
    title: 'Legal hold: an operator stops one person''s erasure, audited'
    status: planned
    issue: 329
    change: 'new; issue #329; ADR-0018 section 10 (GDPR Art. 17(3)(e))'
    acceptance:
    - 'inkcast accounts hold --user <id> --ref <matter> --by <who>, release --user <id> --by <who>, and holds;
      users.legal_hold_at and legal_hold_ref added through COLUMNS; the ref is a matter reference, checked for length
      and characters'
    - 'Store.erase_user refuses a person on hold (STANDING gains the hold), so no path erases them: the account-cleanup
      job, a self-deletion''s return or event, or a breaker confirmation'
    - 'A hold placed on a scheduled person clears users.erase_at; on release the person is disabled again, so the next
      cleanup run notifies them and gives them a full window'
    - 'Each hold and release is audited (identity.account.legal_hold.set and .released, with the id, the ref and who);
      inkcast_identity_accounts{state="legal_hold"} counts them'
    - 'Tests: every erasure path refused while held, the release, the audit'
  - id: F3.3.S10
    title: 'Import an export bundle into a new account: posts and schedules become drafts, nothing is sent'
    status: planned
    issue: 333
    change: 'new; issue #333; ADR-0018 owner decision 7; after F3.3.S7 (#61)'
    acceptance:
    - 'MCP inkcast_import and REST POST /api/v1/account/import take an F3.3.S7 bundle from a signed-in person (schema
      version checked, size limited)'
    - 'Posts become drafts with their markdown and title; schedules become drafts that show the time they had; the
      import sends and schedules nothing; credentials, tokens and per-platform results are not imported'
    - 'Importing the same bundle twice adds nothing the second time (the bundle''s id)'
    - 'Tests: a round trip from export to import, a bundle of a newer schema refused, ids from the bundle never trusted
      as another person''s'
  - id: F3.3.S11
    title: 'Erase an organization: its rows in the owning tables, its tuples, the member dims tombstoned and the outbox
      purged; audited'
    status: planned
    change: 'new 2026-10-28; the organization half of F3.3.S5 (issue #65 built the user half); needs E3''s organizations
      (F3.2.S1)'
- id: F3.11
  title: Envelope encryption of stored credentials
  stories:
  - id: F3.11.S1
    title: 'KeyProvider (local, Vault Transit, AWS KMS, GCP KMS); per-workspace data keys stored wrapped; inkcast rotate-keys
      re-wraps without downtime'
    status: planned
    change: 'new 2026-10-28 (review: product-spec Phase 1; parked as docs/issues/09-security-envelope-encryption.md; the
      social OAuth token store needs it, docs/design/social-platforms-epic.md issue 16)'
    acceptance:
    - 'Platform credentials and notification webhook URLs are encrypted under a data key per workspace, wrapped by the
      KeyProvider; today one Fernet key derived from INKCAST_SECRET_KEY encrypts them (docs/architecture.md)'
    - A key rotation is tested, and a copy of the database alone yields no usable secret

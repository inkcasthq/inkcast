- id: F3.8
  title: Relationship lifecycle
  stories:
  - id: F3.8.S1
    title: Lifecycle tuples (workspace org, channel workspace, post workspace and author) through a transactional outbox;
      deletes remove tuples
    status: planned
    change: new
  - id: F3.8.S2
    title: 'Member API: grant or revoke manager, editor, reviewer, publisher, client reviewer; one-call agency grant; all
      audited'
    status: planned
    change: new
    acceptance:
    - 'Every tuple-writing API checks organization alignment before writing: a role grant needs role.org == the workspace''s
      org (for a channel, its workspace''s org); a workspace, channel or post tuple needs its parent in the same organization;
      agency grants are the only cross-organization writes, and only through the agency grant API'
    - A misaligned write is refused with 422 `cross_organization_grant` and audited; nothing reaches OpenFGA
    - 'The write API refuses a role grant whose role.org isn''t the target''s org, and refuses a role assignee (a user or
      an organization#member) outside the role''s organization. The model (#71) only closes a misaligned grant for people
      outside the role''s organization; a user who is a member of both organizations is the API''s job (docs/authorization.md,
      section 4, case 2)'
    - 'Negative tests at the API level: Globex''s role on Acme''s workspace and channel; an Acme workspace tuple pointing
      at a Globex organization; Acme''s members, and a member of both organizations, assigned to Globex''s role'
  - id: F3.8.S3
    title: Reconciler compares DB-owned relationships with tuples, fixes drift (including misaligned role grants), reports
      a metric
    status: planned
    change: new
- id: F3.9
  title: OpenFGA operations
  stories:
  - id: F3.9.S1
    title: 'Kustomize component: OpenFGA on Postgres, OpenShift restricted-v2, migrate Job, mirrored images'
    status: done
    change: 'built in PR #285'
    acceptance:
    - 'The kubernetes and openshift overlays use OpenFGA and drop INKCAST_AUTHZ_ALLOW_LOCAL=true (set in PR #49 so
      the self-host install path starts before OpenFGA ships)'
    - environments/production sets INKCAST_AUTHZ_ENGINE=openfga and the INKCAST_FGA_* settings; until then it refuses
      to start (INKCAST_AUTHZ_ALLOW_LOCAL=false), by design
  - id: F3.9.S2
    title: NetworkPolicy (only Inkcast services reach OpenFGA); credentials from the secrets store
    status: planned
    change: new
  - id: F3.9.S3
    title: 'kind CI: end-to-end suite split with INKCAST_AUTHZ_ENGINE=openfga'
    status: planned
    change: new
  - id: F3.9.S4
    title: 'Runbooks: model rollout and rollback, store backup and restore, drift'
    status: planned
    change: new
  - id: F3.9.S5
    title: 'OpenShift Local: staging and prod in inkcast-staging and inkcast-prod, OpenFGA on one shared CloudNativePG
      cluster in inkcast-db (a database and a login role per side, pg_hba gating each role to its own database over
      TLS, a NetworkPolicy admitting 5432 from OpenFGA''s pods only); passwords one Secret per side, written once by
      scripts/deploy/openfga-db-credentials.sh; the private image''s pull Secret named on the ServiceAccount and on
      every Inkcast-image pod spec, in the environments only (scripts/deploy/ghcr-pull-secret.sh)'
    status: in-progress
    change: new
    acceptance:
    - environments/staging and environments/production render no Cluster, set their namespaces and keep OpenFGA on
      Secret openfga-db-app key uri; the kubernetes, openshift and ci-openfga overlays keep the per-namespace Cluster
    - deploy/kustomize/shared/inkcast-db renders the Namespace, one Cluster with both managed roles, two Database
      objects and the NetworkPolicy
    - the credentials script never prints or passes a password in argv, keeps an existing pair, and fails naming the
      Secret on a half-present or mismatched pair; the pull-secret script passes the token on stdin only
    - on OpenShift Local (the integrator) the cluster is Ready, both databases exist owned by their roles, each
      migrate Job completes against its own database, a staging role cannot connect to openfga_prod, a pod in a
      third namespace cannot reach 5432, and a pod in each app namespace pulls the image with ghcr-pull
  - id: F3.9.S6
    title: 'Write and pin the OpenFGA model from the deployment, with no manual step: the init container authz-model
      (components/openfga) runs inkcast authz write-model with the pod''s own image before the server, on every pod
      start; INKCAST_FGA_STORE_NAME pins by name at start-up (the store and the version equal to the packaged
      model), with a named refusal while they are missing'
    status: in-progress
    change: 'new; issue #315'
    acceptance:
    - An init container authz-model on every Inkcast Deployment whose processes check permissions (the all-in-one
      Deployment, or each split service but the Gateway) runs `inkcast authz write-model` with the server's image
      (the same digest) before the server, on every pod start, with no Job, nothing immutable to apply over and no
      manual step; it fits restricted-v2, reads inkcast-config and the key mounted 0440, and on OpenShift trusts the
      cluster's CA bundle as the server does
    - 'Pods starting together on a fresh install converge on one store: a writer that created a store lists the
      stores of the name again, every writer uses the oldest, and one whose own store is not the oldest deletes it
      before writing into it, while it holds no version; a writer that created none deletes every younger store that
      holds no version (left by a racer whose delete or create answer was lost), and none that holds one; the model
      write stays idempotent'
    - 'Inkcast pins the model version that equals its own packaged model: with the ids unset and the store named,
      start-up resolves the store by name and the version equal to the packaged model. It refuses to start with a
      named error (exit 78) while that version doesn''t exist'
    - Explicit INKCAST_FGA_STORE_ID / INKCAST_FGA_MODEL_ID still win when set (existing deployments are unchanged),
      and the init container then writes nothing and calls nothing
    - 'Negative tests: OpenFGA down, store missing, only an older model present, two stores of the same name (a
      refusal that names the problem, not a silent pick), two and three racers, a create that lands late, a create
      whose answer is lost'
    - 'Proven on kind in CI and on OpenShift Local: a fresh inkcast-staging reaches Ready with no manual step, and a
      restarted pod finds the model unchanged with the same ids and one store'

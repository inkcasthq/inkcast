[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkcast"
version = "0.1.0"
description = "Publish and schedule your writing across platforms from Claude Code or any MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ScalarOps Technologies LLC" }]
dependencies = [
  "mcp>=2.2,<3",
  "httpx2>=2.5",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/inkcasthq/inkcast"
Documentation = "https://github.com/inkcasthq/inkcast/blob/main/docs/README.md"
Licensing = "https://github.com/inkcasthq/inkcast/blob/main/LICENSING.md"
Source = "https://github.com/inkcasthq/inkcast"
Issues = "https://github.com/inkcasthq/inkcast/issues"

[project.scripts]
inkcast = "inkcast.launcher:main"

# Third-party plug-ins register here, e.g. in their own pyproject:
# [project.entry-points."inkcast.platforms"]
# hashnode = "inkcast_hashnode:HashnodePlatform"
# [project.entry-points."inkcast.services"]
# AnalyticsService = "inkcast_analytics:SERVICE"

[tool.hatch.build.targets.wheel]
packages = ["src/inkcast"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["src/inkcast/static"]

[tool.ruff.lint]
# Correctness first (pyflakes + syntax). Widen deliberately, one rule family per PR.
select = ["F", "E9"]

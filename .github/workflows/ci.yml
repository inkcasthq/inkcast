# Every check that decides whether a change is mergeable. Runs on pull requests, weekly
# (vulnerability data changes without the code changing), and as the gate inside publish.yml
# for every push to main and every release tag (so main is never checked twice).
#
# PLAN SWITCHES (repository variables). On a PUBLIC repository both features are free and switch
# on automatically; the variables only matter while the repository is private (GitHub Team):
#   CODE_SECURITY=true   only if GitHub Code Security is enabled. Without it, code scanning
#                        (CodeQL, SARIF upload) is unavailable on private repos; the Grype gate
#                        still fails the build and its SARIF is kept as an artifact instead.
#
# ACTION PINS: every action is referenced by the full commit of a released version, with the
# version as a comment. Tags like @v4 are mutable. Dependabot (.github/dependabot.yml) moves the
# SHA and the comment together. To bump by hand:
#   gh api repos/<owner>/<action>/git/ref/tags/<tag>   (resolve annotated tags to the commit)
name: ci

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - run: pip install 'ruff==0.12.0'
      - run: scripts/ci-run.sh ruff ruff check src tests scripts
      - name: Vendored API-docs bundles match ASSETS.lock (offline)
        run: bash scripts/vendor-assets.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python }}"}
      - run: scripts/ci-run.sh "pip install" pip install -e .
      # Pinning playwright pins the Chromium build it installs.
      - run: scripts/ci-run.sh playwright bash -c "pip install 'playwright==1.56.0' && python -m playwright install --with-deps chromium"
      - name: Unit + end-to-end tests (fake IdP, Medium, DEV; real browser for /api and /api/redoc)
        env:
          INKCAST_CAPTURE_DIR: ${{ runner.temp }}/captures
        run: |
          mkdir -p "$INKCAST_CAPTURE_DIR"
          PYTHONPATH=src:tests scripts/ci-run.sh tests python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.python == '3.14'
        with:
          name: captures-${{ github.sha }}
          path: ${{ runner.temp }}/captures
          retention-days: 14

  authz:
    # The OpenFGA authorization model (authz/): valid, its tests pass, and the compiled JSON is current.
    runs-on: ubuntu-24.04
    env:
      FGA_VERSION: "0.8.2"
      FGA_SHA256: e48c4a73cf68031fe9fc0827f1462a9b2d6981e3d2e9b82f1e1c2e120c293443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the OpenFGA CLI (pinned version and checksum)
        run: |
          curl -sSL -o fga.tgz "https://github.com/openfga/cli/releases/download/v${FGA_VERSION}/fga_${FGA_VERSION}_linux_amd64.tar.gz"
          echo "${FGA_SHA256}  fga.tgz" | sha256sum -c
          tar -xzf fga.tgz fga && sudo install fga /usr/local/bin/fga
      - run: scripts/ci-run.sh "fga model validate" fga model validate --file authz/model.fga
      - run: scripts/ci-run.sh "fga model test" fga model test --tests authz/model.fga.yaml
      - name: Compiled model is current
        run: |
          fga model transform --file authz/model.fga --output-format json | python3 -m json.tool > "$RUNNER_TEMP/model.json"
          scripts/ci-run.sh "authz/model.json is stale (run: fga model transform --file authz/model.fga --output-format json | python3 -m json.tool > authz/model.json)" diff -u authz/model.json "$RUNNER_TEMP/model.json"

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render every overlay and environment (kubectl's built-in kustomize)
        run: |
          set -euo pipefail
          for d in deploy/kustomize/overlays/* deploy/kustomize/environments/*; do
            echo "::group::$d"; scripts/ci-run.sh "kustomize $d" kubectl kustomize "$d" -o "$RUNNER_TEMP/rendered.yaml"; echo "ok"; echo "::endgroup::"
          done
      - name: Alert rules pass promtool (deploy/dev/prometheus/rules.yaml, the PrometheusRule's groups)
        run: |
          scripts/ci-run.sh "promtool check rules" docker run --rm -v "$PWD/deploy/dev/prometheus:/w:ro" \
            --entrypoint promtool quay.io/prometheus/prometheus:v3.5.0 check rules /w/rules.yaml

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload the scan to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-run.sh "docker build" docker build -t inkcast:ci .
      - name: Scan the image (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: inkcast:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.scan.outputs.sarif != '' && (vars.CODE_SECURITY == 'true' || github.event.repository.visibility == 'public')
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.sarif != ''
        with:
          name: image-scan-${{ github.sha }}
          path: ${{ steps.scan.outputs.sarif }}
          retention-days: 30

  kind:
    # Deploys the real image with the real manifests: proves they apply under Pod Security
    # "restricted", start as a non-root arbitrary user on a read-only root filesystem, and serve.
    runs-on: ubuntu-24.04
    needs: [manifests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t inkcast:ci .
      - name: Create cluster and load the image (kind and kubectl ship on the runner image)
        run: |
          kind create cluster --name inkcast --wait 120s
          kind load docker-image inkcast:ci --name inkcast
      - name: Deploy the CI overlay
        run: |
          kubectl apply -k deploy/kustomize/overlays/ci
          kubectl -n inkcast rollout status deploy/inkcast --timeout=180s
      - name: Smoke test through a port-forward
        run: |
          set -euo pipefail
          kubectl -n inkcast port-forward svc/inkcast 8787:8787 >/dev/null 2>&1 &
          kubectl -n inkcast port-forward svc/inkcast-metrics 9090:9090 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:9090/readyz && break; sleep 1; done
          curl -sf localhost:9090/livez
          curl -sf localhost:9090/metrics | grep -q inkcast_build_info
          curl -sf localhost:8787/api/openapi.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["openapi"].startswith("3.1")'
          curl -sf localhost:8787/api | grep -q swagger-ui-bundle.js
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/mcp -H 'Accept: application/json, text/event-stream' -d '{}')" = 401
          curl -sf localhost:8787/.well-known/oauth-authorization-server | grep -q registration_endpoint
      - name: Restore drill (back up, lose a row, restore, prove it is back; docs/runbooks/backup-restore.md)
        run: scripts/ci-run.sh "restore drill" scripts/ops/backup-drill.sh inkcast
      - name: Sign in through a real Keycloak (E9.F9.1; realm from deploy/keycloak, a role-less user refused)
        run: scripts/ci-run.sh "keycloak sign-in" scripts/dev/keycloak-e2e.sh
      - name: Deploy the split services (one Deployment per INKCAST_APP_NAME, built-in Gateway in front)
        run: |
          scripts/ci-run.sh "apply ci-split" kubectl apply -k deploy/kustomize/overlays/ci-split
          scripts/ci-run.sh "split rollout" scripts/ci-rollout.sh inkcast-split 180s
      - name: Smoke test the split services through the Gateway
        run: |
          set -euo pipefail
          kubectl -n inkcast-split port-forward svc/inkcast 8788:8787 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8788/livez && break; sleep 1; done
          curl -sf localhost:8788/api/openapi.json | python3 -c 'import json,sys; assert "/api/v1/stories:sync" in json.load(sys.stdin)["paths"]'
          curl -sf localhost:8788/.well-known/oauth-authorization-server | grep -q registration_endpoint
          curl -sf localhost:8788/.well-known/oauth-protected-resource/mcp | grep -q authorization_servers
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8788/mcp -H 'Accept: application/json, text/event-stream' -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8788/connect/expired)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8788/api/v1/tokens)" = 401
      - name: Python, Playwright and Chromium for the dashboard check
        run: |
          pip install -e . 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Dashboards on kind (deploy/dev; Prometheus and Grafana, seeded, every panel checked)
        run: BUILD=0 scripts/ci-run.sh "dashboards on kind" scripts/dev/stack.sh kind
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboards-kind-${{ github.sha }}
          path: deploy/dev/.captures/
          include-hidden-files: true    # .captures is a dot-directory
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: |
          for ns in inkcast inkcast-split monitoring keycloak inkcast-oidc; do
            kubectl -n $ns get all,events || true
            kubectl -n $ns describe pod || true
            for d in $(kubectl -n $ns get deploy -o name); do kubectl -n $ns logs "$d" --tail=100 || true; done
          done

  dashboards:
    # The local observability stack under Docker Compose (deploy/dev): Inkcast + fake platforms + Prometheus +
    # Grafana; seeds real traffic, runs every panel's queries through Grafana, screenshots the dashboard.
    runs-on: ubuntu-24.04
    needs: [manifests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - run: |
          pip install -e . 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Compose stack, seed and check
        run: scripts/ci-run.sh "dashboards on compose" scripts/dev/stack.sh compose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboards-compose-${{ github.sha }}
          path: deploy/dev/.captures/
          include-hidden-files: true    # .captures is a dot-directory
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f deploy/dev/compose.yaml ps -a || true
          docker compose -f deploy/dev/compose.yaml logs --tail=80 || true

# Every check that decides whether a change is mergeable. Runs on pull requests, weekly
# (vulnerability data changes without the code changing), and as the gate inside publish.yml
# for every push to main and every release tag (so main is never checked twice).
#
# PLAN SWITCHES (repository variables; the repo is private on GitHub Team):
#   CODE_SECURITY=true   only if GitHub Code Security is enabled. Without it, code scanning
#                        (CodeQL, SARIF upload) is unavailable on private repos; the Grype gate
#                        still fails the build and its SARIF is kept as an artifact instead.
#
# ACTION PINS: every action is referenced by the full commit of a released version, with the
# version as a comment. Tags like @v4 are mutable. Dependabot (.github/dependabot.yml) moves the
# SHA and the comment together. To bump by hand:
#   gh api repos/<owner>/<action>/git/ref/tags/<tag>   (resolve annotated tags to the commit)
name: ci

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install 'ruff==0.12.0'
      - run: ruff check src tests
      - name: Vendored API-docs bundles match ASSETS.lock (offline)
        run: bash scripts/vendor-assets.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .
      # Pinning playwright pins the Chromium build it installs.
      - run: pip install 'playwright==1.56.0' && python -m playwright install --with-deps chromium
      - name: Unit + end-to-end tests (fake IdP, Medium, DEV; real browser for /api and /api/redoc)
        env:
          INKCAST_CAPTURE_DIR: ${{ runner.temp }}/captures
        run: |
          mkdir -p "$INKCAST_CAPTURE_DIR"
          PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.python == '3.12'
        with:
          name: captures-${{ github.sha }}
          path: ${{ runner.temp }}/captures
          retention-days: 14

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render every overlay and environment (kubectl's built-in kustomize)
        run: |
          set -euo pipefail
          for d in deploy/kustomize/overlays/* deploy/kustomize/environments/*; do
            echo "::group::$d"; kubectl kustomize "$d" > /dev/null; echo "ok"; echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the scan to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t inkcast:ci .
      - name: Scan the image (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: inkcast:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && steps.scan.outputs.sarif != '' && vars.CODE_SECURITY == 'true'
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scan.outputs.sarif != ''
        with:
          name: image-scan-${{ github.sha }}
          path: ${{ steps.scan.outputs.sarif }}
          retention-days: 30

  kind:
    # Deploys the real image with the real manifests: proves they apply under Pod Security
    # "restricted", start as a non-root arbitrary user on a read-only root filesystem, and serve.
    runs-on: ubuntu-latest
    needs: [manifests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t inkcast:ci .
      - name: Create cluster and load the image (kind and kubectl ship on the runner image)
        run: |
          kind create cluster --name inkcast --wait 120s
          kind load docker-image inkcast:ci --name inkcast
      - name: Deploy the CI overlay
        run: |
          kubectl apply -k deploy/kustomize/overlays/ci
          kubectl -n inkcast rollout status deploy/inkcast --timeout=180s
      - name: Smoke test through a port-forward
        run: |
          set -euo pipefail
          kubectl -n inkcast port-forward svc/inkcast 8787:8787 >/dev/null 2>&1 &
          kubectl -n inkcast port-forward svc/inkcast-metrics 9090:9090 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:9090/readyz && break; sleep 1; done
          curl -sf localhost:9090/livez
          curl -sf localhost:9090/metrics | grep -q inkcast_build_info
          curl -sf localhost:8787/api/openapi.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["openapi"].startswith("3.1")'
          curl -sf localhost:8787/api | grep -q swagger-ui-bundle.js
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/mcp -H 'Accept: application/json, text/event-stream' -d '{}')" = 401
          curl -sf localhost:8787/.well-known/oauth-authorization-server | grep -q registration_endpoint
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n inkcast get all,events
          kubectl -n inkcast describe pod
          kubectl -n inkcast logs deploy/inkcast --tail=200

  codeql:
    if: vars.CODE_SECURITY == 'true'   # needs GitHub Code Security on private repos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, javascript-typescript
          queries: security-extended
          config: |
            paths-ignore: [src/inkcast/static/vendor]
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

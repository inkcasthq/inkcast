# Code scanning (CodeQL), in its own workflow so pull requests and main record the SAME configuration
# (`codeql.yml:analyze`). Inside ci.yml it ran as `ci.yml:codeql` on pull requests but as `publish.yml:codeql` on
# main (ci.yml is publish.yml's gate there), so GitHub could never tell which alerts a pull request adds (#15).
#
# Locally, the same analysis with each result's source-to-sink path: scripts/dev/codeql.sh (it pins the bundle this
# action version uses; tests/test_architecture.py keeps the two in step).
#
# PLAN SWITCH: on a private repository code scanning needs GitHub Code Security (CODE_SECURITY=true); on a public
# repository it is free and switches on by itself.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new queries find old code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: (vars.CODE_SECURITY == 'true' || github.event.repository.visibility == 'public')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python, javascript-typescript
          # The same file scripts/dev/codeql.sh uses: queries (security-extended) and paths-ignore.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

# Code scanning (CodeQL), in its own workflow so pull requests and main record the SAME configuration
# (`codeql.yml:analyze`). Inside ci.yml it ran as `ci.yml:codeql` on pull requests but as `publish.yml:codeql` on
# main (ci.yml is publish.yml's gate there), so GitHub could never tell which alerts a pull request adds (#15).
#
# PLAN SWITCH: on a private repository code scanning needs GitHub Code Security (CODE_SECURITY=true); on a public
# repository it is free and switches on by itself.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new queries find old code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: (vars.CODE_SECURITY == 'true' || github.event.repository.visibility == 'public')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, javascript-typescript
          queries: security-extended
          # Tests deliberately build insecure fixtures (world-readable secret files, throwaway keys, fake
          # IdPs) to prove the checks catch them; scanning them only produces false alerts.
          config: |
            paths-ignore: [src/inkcast/static/vendor, tests]
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

# Weekly, grouped updates. Actions are SHA-pinned with the version in a comment; Dependabot moves both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {actions: {patterns: ["*"]}}
    labels: [dependencies, github-actions]
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {python: {patterns: ["*"]}}
    labels: [dependencies, python]
  - package-ecosystem: docker          # the Dockerfile's FROM lines, tag and digest (E1.F1.8.S2)
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, docker]
  - package-ecosystem: docker-compose  # deploy/dev/compose.yaml: Prometheus and Grafana, tag and digest
    directory: /deploy/dev
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, docker]
